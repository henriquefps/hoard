openapi: 3.1.0
info:
  title: hoard-server device API
  version: "1"
  summary: Sync of Reveal edits, library metadata, smart previews and original backups with a self-hosted server.
  description: |
    The normative description is ADR 0013 (docs/adr/0013-server-protocol.md in the Hoard repository; formerly Reveal
    ADR 0017); where this file and the ADR differ, the ADR wins. Every request except `GET /v1/health` and `POST /v1/pair` needs `Authorization: Bearer <device key>`.
    Errors are always `{"error": {"code", "message", "details"?}}` (see `Error`).
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: "{server}"
    variables:
      server:
        default: http://192.168.1.10:3071
        description: The address from the pairing QR code (any reveal-sync server).
security:
  - deviceKey: []
tags:
  - name: server
  - name: pairing
  - name: changes
  - name: blobs
  - name: originals
  - name: nas
  - name: items
  - name: previews
  - name: culling
  - name: devices
  - name: web
    description: The web gallery's API (ADR 0018), outside /v1.
paths:
  /v1/health:
    get:
      tags: [server]
      summary: Liveness and counts (no names or paths)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version, api, counts]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                  api: { type: integer, const: 1 }
                  counts: { $ref: "#/components/schemas/Counts" }
  /v1/server:
    get:
      tags: [server]
      summary: Server identity and the limits that apply
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/pair:
    post:
      tags: [pairing]
      summary: Exchange a one-time pairing token (from the QR code) for this device's key
      description: |
        The QR code holds `revealsync://pair?v=1&url=<server URL>&token=<token>&server=<serverId>`. Tokens are valid
        for 10 minutes and once. The key in the answer is shown only here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, deviceName]
              properties:
                token: { type: string, maxLength: 100 }
                deviceName: { type: string, minLength: 1, maxLength: 100 }
                platform: { type: string, maxLength: 40, examples: [android] }
                appVersion: { type: string, maxLength: 40 }
                app: { $ref: "#/components/schemas/AppName" }
                manufacturer: { type: string, maxLength: 64, description: "Build.MANUFACTURER (ADR 0017; 0.7.0)" }
                model: { type: string, maxLength: 64, description: "Build.MODEL (ADR 0017; 0.7.0)" }
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, apiKey, serverId, serverName]
                properties:
                  deviceId: { $ref: "#/components/schemas/Uuid" }
                  apiKey: { type: string, pattern: "^rvk1_[0-9a-f]{16}_[A-Za-z0-9_-]{43}$" }
                  serverId: { $ref: "#/components/schemas/Uuid" }
                  serverName: { type: string }
                  physicalDeviceId:
                    $ref: "#/components/schemas/Uuid"
                    description: The physical device this new device starts in (its own deviceId). ADR 0017; 0.7.0.
                  candidates:
                    type: array
                    description: Physical devices this one may be (same model first). ADR 0017; 0.7.0.
                    items: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_pairing_token`: unknown, used or expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/changes:
    get:
      tags: [changes]
      summary: Records changed since a cursor, oldest first, each once at its latest state
      parameters:
        - name: cursor
          in: query
          description: Opaque; empty or absent = from the start.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: A page of the feed
          content:
            application/json:
              schema:
                type: object
                required: [changes, cursor, hasMore]
                properties:
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/Record" }
                  cursor: { type: string }
                  hasMore: { type: boolean }
        "400":
          description: "`invalid_cursor` (pull from the start) or `invalid_request`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [changes]
      summary: Push up to 500 changes (all validated first; applied in order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/Change" }
      responses:
        "200":
          description: One result per change, in order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Result" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: "`invalid_change`; `details.index` names the change. Nothing was applied."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/fingerprints/lookup:
    post:
      tags: [originals]
      summary: Which of these files can the server already reach (NAS or backup)?
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprints]
              properties:
                fingerprints:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/Fingerprint" }
      responses:
        "200":
          description: Found and missing fingerprints
          content:
            application/json:
              schema:
                type: object
                required: [found, missing]
                properties:
                  found:
                    type: array
                    items:
                      type: object
                      required: [fingerprint, size, source]
                      properties:
                        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
                        size: { type: integer }
                        source: { type: string, enum: [nas, backup] }
                        sha256: { $ref: "#/components/schemas/Sha256" }
                  missing:
                    type: array
                    items: { $ref: "#/components/schemas/Fingerprint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/originals/{fingerprint}:
    get:
      tags: [originals]
      summary: A photo file by fingerprint (NAS or uploaded); Range and HEAD supported
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Fingerprint" }
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { $ref: "#/components/responses/Bytes" }
        "206": { $ref: "#/components/responses/PartialBytes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: "`unavailable`: the NAS file changed since it was indexed or the share is offline (Retry-After)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [originals]
      summary: Delete the uploaded original of a fingerprint once no live photo record names it
      description: >-
        The user deleted the photo from the server (0.5.3). Any paired device may ask, after pushing the photo's
        tombstone: a photo record that is not deleted and names the fingerprint (its main file or any file of the shot)
        keeps it. The check and the delete are atomic; the blob's file goes when no other fingerprint uses its bytes.
        Indexed NAS files are never deleted.
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Fingerprint" }
      responses:
        "204": { description: The uploaded original is gone }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden`, `details.reason` = `nas`: the file is in an indexed NAS folder"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`, `details.reason` = `referenced`: a live photo record still names it"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/blobs/{sha256}:
    get:
      tags: [blobs]
      summary: A blob by its SHA-256; Range and HEAD supported
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Sha256" }
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { $ref: "#/components/responses/Bytes" }
        "206": { $ref: "#/components/responses/PartialBytes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [blobs]
      summary: Drop a smart preview this device uploaded once no live photo record names it
      description: >-
        Only `preview` blobs, only by the device that uploaded them, and only when no photo record that is not deleted
        names the blob in `data.preview.sha256` (push the record without it first). The check and the delete are
        atomic. Originals are never dropped by a device.
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Sha256" }
      responses:
        "204": { description: The preview is gone }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden`: `details.reason` is `original` (not a preview) or `other_device` (not this device's)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`, `details.reason` = `referenced`: a live photo record still names it"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/uploads:
    post:
      tags: [blobs]
      summary: Start (or find again) a chunked upload of a blob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, size, kind]
              properties:
                sha256: { $ref: "#/components/schemas/Sha256" }
                size: { type: integer, minimum: 1, maximum: 4294967296 }
                kind: { type: string, enum: [original, preview] }
                fingerprint:
                  description: Required for an original, absent for a preview.
                  $ref: "#/components/schemas/Fingerprint"
      responses:
        "200":
          description: "`exists` (nothing to send) or `resume` (an unfinished upload of this device)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "201":
          description: "`created`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`storage_not_configured`: no backup folder chosen on the server"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    head:
      tags: [blobs]
      summary: Where an upload stands
      responses:
        "204":
          description: Upload-Offset and Upload-Length headers
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
        "404": { description: No such upload for this device }
    patch:
      tags: [blobs]
      summary: Append the next chunk (at most chunkSize bytes) at Upload-Offset
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: "Stored. `Upload-Complete: 1` when this chunk finished and verified the blob."
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
            Upload-Complete: { schema: { type: string, const: "1" } }
        "400":
          description: "`invalid_request`: missing header, or the chunk was interrupted (bytes that arrived are kept; HEAD and continue)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`offset_mismatch` (`details.offset` is the server's) or `upload_busy`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: "`checksum_mismatch`: the bytes do not match sha256 or fingerprint; the upload restarts at 0"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [blobs]
      summary: Abandon an upload
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/devices:
    get:
      tags: [devices]
      summary: The paired devices that are not revoked (to name the device of a conflict copy)
      responses:
        "200":
          description: Devices, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      required: [id, name, platform]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        platform: { type: string }
                        physicalDeviceId: { type: string, description: "ADR 0017; 0.7.0" }
                        app: { type: [string, "null"], description: "ADR 0017; 0.7.0" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/device:
    get:
      tags: [devices]
      summary: This device, its physical device and the physical devices it may be (ADR 0017; hoard-server 0.7.0)
      responses:
        "200":
          description: The device view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [devices]
      summary: Report this device's app, manufacturer, model and capabilities (ADR 0017; hoard-server 0.7.0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app: { $ref: "#/components/schemas/AppName" }
                manufacturer: { type: string, maxLength: 64 }
                model: { type: string, maxLength: 64 }
                features:
                  type: array
                  maxItems: 16
                  items: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
                  description: |
                    Capabilities the app implements (ADR 0016). Known ones are recorded, unknown ones ignored, and a
                    recorded one is never removed. `culling`: the device syncs culling per field, so the server stops
                    bridging the culling fields of its photo records.
      responses:
        "200":
          description: The device view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/device/claim:
    post:
      tags: [devices]
      summary: Move this device into a physical device, or (null) into one of its own (ADR 0017; hoard-server 0.7.0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [physicalDeviceId]
              properties:
                physicalDeviceId: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The device view after the move
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict` with `details.reason = same_app`: that physical device already has a live device of this app id (build variant included)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/nas/files:
    get:
      tags: [nas]
      summary: The files the server indexes on its NAS folders, as a feed
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: A page of the NAS feed
          content:
            application/json:
              schema:
                type: object
                required: [files, cursor, hasMore]
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/NasFile" }
                  cursor: { type: string }
                  hasMore: { type: boolean }
        "400":
          description: "`invalid_cursor`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/items/changes:
    get:
      tags: [items]
      summary: The items feed (ADR 0014; hoard-server 0.5.0)
      description: |
        Every item whose revision is greater than the cursor, once, at its latest state, oldest revision first.
        Tombstones (`deleted: true`) are kept forever. Own revision counter and cursors (not interchangeable with
        `/v1/changes` or `/v1/nas/files`). Since 0.7.0 (ADR 0016) culling records share the counter and come with
        `include=culling`; `limit` then counts items plus culling records.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: include
          in: query
          description: "Comma-separated `items`, `culling` (ADR 0016; 0.7.0). Absent = `items`."
          schema: { type: string, default: items, examples: ["items,culling", culling] }
      responses:
        "200":
          description: A page of the items feed
          content:
            application/json:
              schema:
                type: object
                required: [items, cursor, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  culling:
                    type: array
                    description: With include=culling only.
                    items: { $ref: "#/components/schemas/Culling" }
                  cursor: { type: string }
                  hasMore: { type: boolean }
        "400":
          description: "`invalid_cursor`, `invalid_request`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/items:
    get:
      tags: [items]
      summary: Live items in capture-time order, filtered (ADR 0014; hoard-server 0.5.0)
      description: |
        A query, not a change feed: live items only, ordered by `sortTime` then `id`, paged with a keyset cursor
        that is only valid with the same `order`. Repeat the same filters with each cursor.
      parameters:
        - name: kind
          in: query
          description: Comma-separated kinds.
          schema: { type: string, example: "photo,pair" }
        - name: from
          in: query
          description: "`sortTime` at least this (Unix ms)."
          schema: { type: integer }
        - name: to
          in: query
          description: "`sortTime` below this (Unix ms)."
          schema: { type: integer }
        - name: folder
          in: query
          description: A NAS folder id (`folderId` of a location).
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: path
          in: query
          description: With `folder`, a directory relative to it ('/'-separated, no leading or trailing '/'); its sub-directories are included.
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [desc, asc], default: desc }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema:
                type: object
                required: [items, cursor, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  cursor:
                    description: The next page's cursor; null on the last page.
                    oneOf:
                      - type: string
                      - type: "null"
                  hasMore: { type: boolean }
        "400":
          description: "`invalid_request`, `invalid_cursor`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/items/{itemId}:
    get:
      tags: [items]
      summary: One item (a tombstone too)
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/items/lookup:
    post:
      tags: [items]
      summary: The live items that have any of these fingerprints as a member file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprints]
              properties:
                fingerprints:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/Fingerprint" }
      responses:
        "200":
          description: Matches, the items they name (each once) and the fingerprints no item has
          content:
            application/json:
              schema:
                type: object
                required: [items, matches, missing]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  matches:
                    type: array
                    items:
                      type: object
                      required: [fingerprint, itemId, role]
                      properties:
                        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
                        itemId: { $ref: "#/components/schemas/Uuid" }
                        role: { $ref: "#/components/schemas/Role" }
                  missing:
                    type: array
                    items: { $ref: "#/components/schemas/Fingerprint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/items/{itemId}/preview:
    get:
      tags: [previews]
      summary: An item's preview (thumb or screen, JPEG or WebP); a video's poster frame (ADR 0015)
      description: >-
        Upright sRGB JPEG, long edge at most 512 (thumb) or 2560 (screen) px, never upscaled, from the item's best
        source (a pair's camera JPEG, a RAW's embedded preview or a LibRaw decode, HEIF/AVIF; a video's first non-dark
        frame at 10/25/50 %). Not made yet: 202 with Retry-After after queueing it ahead of the backlog. Ready: the
        file with `ETag` and `X-Hoard-Preview-Version` (its content key); with `v` equal to that key the answer is
        `Cache-Control: private, max-age=31536000, immutable`, otherwise `private, no-cache` (revalidate: 304).
        `X-Hoard-Preview: stale` = an older preview (older recipe or source) served while the new one is made.
        HEAD and Range work. Its own per-device rate (200/s, burst 600), separate from the API's.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewSize"
        - $ref: "#/components/parameters/PreviewFormat"
        - $ref: "#/components/parameters/PreviewVersion"
      responses:
        "200": { $ref: "#/components/responses/PreviewImage" }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "304": { description: Not modified (If-None-Match) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{itemId}/poster:
    get:
      tags: [previews]
      summary: A video item's poster frame (thumb or screen); the same file as /preview of a video
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewSize"
        - $ref: "#/components/parameters/PreviewFormat"
        - $ref: "#/components/parameters/PreviewVersion"
      responses:
        "200": { $ref: "#/components/responses/PreviewImage" }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "304": { description: Not modified (If-None-Match) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{itemId}/proxy:
    get:
      tags: [previews]
      summary: The low-bitrate proxy of a video or of a motion photo's video; Range and HEAD supported
      description: >-
        MP4 (faststart): H.264 High, short edge at most 720 px, at most 30 fps, a keyframe every 2 s, capped CRF
        (at most 2.5 Mb/s), AAC stereo 128 kb/s; HDR (PQ, HLG, Dolby Vision's base layer) tone-mapped to SDR BT.709.
        Same caching and 202 rules as /preview.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewVersion"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: The proxy (video/mp4)
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: The requested range
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "304": { description: Not modified (If-None-Match) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/previews:
    post:
      tags: [previews]
      summary: The preview states of up to 500 items; queues the ones not made (a gallery warming a screen)
      description: >-
        Queued at the "warm" priority (after a client waiting on a GET, before recently added items and the backlog);
        the first item of the list first. `v` of a ready preview builds an immutable URL (`?v=`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/Uuid" }
                previews:
                  type: array
                  description: Which previews (default thumb).
                  items: { type: string, enum: [thumb, screen, proxy] }
      responses:
        "200":
          description: Per item (each once, in the order asked), the state of each preview asked; unknown or deleted ids in missing
          content:
            application/json:
              schema:
                type: object
                required: [items, missing]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { $ref: "#/components/schemas/Uuid" }
                        thumb: { $ref: "#/components/schemas/PreviewState" }
                        screen: { $ref: "#/components/schemas/PreviewState" }
                        proxy: { $ref: "#/components/schemas/PreviewState" }
                  missing:
                    type: array
                    items: { $ref: "#/components/schemas/Uuid" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/culling:
    post:
      tags: [culling]
      summary: Push culling changes, one field each (ADR 0016; hoard-server 0.7.0)
      description: |
        Applied in order in one transaction; per field: same value = unchanged, `baseRev` equal to the field's rev =
        applied, else last-writer-wins on `modifiedAt` then device id. A `modifiedAt` more than 10 minutes ahead of the
        server is clipped. A change that cannot be applied (validation, an unknown `itemId`, a label over 64
        characters) is a result with `status: invalid` and a `code`; the other changes apply and the answer is 200.
        Only a body that is not a push (malformed JSON, 0 or more than 500 changes) is refused. Calling it marks the
        device culling-aware (its photo records are no longer bridged).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  description: A change that does not match CullChange is an `invalid` result, not a 4xx.
                  items: { $ref: "#/components/schemas/CullChange" }
      responses:
        "200":
          description: One result per change, in order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CullResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/culling/{itemId}:
    get:
      tags: [culling]
      summary: One item's culling record (ADR 0016; hoard-server 0.7.0)
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Culling" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  # --- Web gallery (ADR 0018; hoard-server 0.8.0). LAN/Tailscale only (404 through a proxy), signed in with the admin
  # password (cookie `hoard_web`); writes need `X-Hoard-Web: 1`. Not for devices: the device API is /v1.
  /web/session:
    get:
      tags: [web]
      summary: Whether this browser is signed in to the gallery
      security: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                type: object
                required: [signedIn, setup, version]
                properties:
                  signedIn: { type: boolean }
                  setup: { type: boolean, description: No admin password yet (use the setup page). }
                  version: { type: string }
                  writer: { type: string, description: "The session's culling writer id, web:<16 hex>; empty when signed out." }
                  previews: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [web]
      summary: Sign in with the admin password (argon2id; 5 a minute per address)
      security: []
      parameters:
        - $ref: "#/components/parameters/WebCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Signed in; sets the HttpOnly, SameSite=Strict cookie `hoard_web` (Path=/web/, 7 days idle)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  writer: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: No admin password yet }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [web]
      summary: Sign out
      parameters:
        - $ref: "#/components/parameters/WebCsrf"
      responses:
        "200": { description: Signed out; the cookie is cleared }
        "403": { $ref: "#/components/responses/Forbidden" }
  /web/library:
    get:
      tags: [web]
      summary: The library index, whole or the changes since a cursor (ADR 0018 "Library index")
      security: [{ webSession: [] }]
      parameters:
        - name: cursor
          in: query
          description: "<boot>:<generation> from the last answer; empty, foreign or malformed = the whole index."
          schema: { type: string }
      responses:
        "200":
          description: Rows newest first; gzip when accepted
          content:
            application/json:
              schema:
                type: object
                required: [cursor, full, rows, removed, folders, total]
                properties:
                  cursor: { type: string }
                  full: { type: boolean }
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/LibraryRow" }
                  removed:
                    type: array
                    items: { $ref: "#/components/schemas/Uuid" }
                  folders:
                    type: object
                    additionalProperties: { type: string }
                    description: NAS folder id to name.
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /web/folders:
    get:
      tags: [web]
      summary: NAS folders with item counts per directory
      security: [{ webSession: [] }]
      responses:
        "200":
          description: Every NAS folder (empty ones too) and the items uploaded by devices
          content:
            application/json:
              schema:
                type: object
                required: [folders, uploads]
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      required: [id, name, state, items, dirs]
                      properties:
                        id: { $ref: "#/components/schemas/Uuid" }
                        name: { type: string }
                        state: { type: string, description: "pending, indexing, ready, error, unavailable, disabled, removed" }
                        items: { type: integer }
                        dirs:
                          type: array
                          items:
                            type: object
                            properties:
                              path: { type: string, description: '"" = the folder itself' }
                              items: { type: integer }
                  uploads: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /web/items/{itemId}:
    get:
      tags: [web]
      summary: One live item with its culling record and the edited-in-Reveal flag
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                type: object
                required: [item, culling, edited]
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  culling:
                    oneOf:
                      - { $ref: "#/components/schemas/Culling" }
                      - { type: "null" }
                  edited: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /web/items/{itemId}/exif:
    get:
      tags: [web]
      summary: Exposure read on demand from the item's still (not stored)
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Fields absent when not recorded (and for videos)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exposure:
                    type: object
                    properties:
                      exposureTime: { type: number, description: seconds }
                      fNumber: { type: number }
                      iso: { type: integer }
                      bias: { type: number, description: EV }
                      focalLength: { type: number, description: mm }
                      focalLength35: { type: integer, description: mm }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /web/items/{itemId}/preview:
    get:
      tags: [web]
      summary: As GET /v1/items/{itemId}/preview, with the gallery session
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewSize"
        - $ref: "#/components/parameters/PreviewFormat"
        - $ref: "#/components/parameters/PreviewVersion"
      responses:
        "200": { $ref: "#/components/responses/PreviewImage" }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
  /web/items/{itemId}/poster:
    get:
      tags: [web]
      summary: As GET /v1/items/{itemId}/poster, with the gallery session
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewSize"
        - $ref: "#/components/parameters/PreviewFormat"
        - $ref: "#/components/parameters/PreviewVersion"
      responses:
        "200": { $ref: "#/components/responses/PreviewImage" }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
  /web/items/{itemId}/proxy:
    get:
      tags: [web]
      summary: As GET /v1/items/{itemId}/proxy (MP4, ranges), with the gallery session
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewVersion"
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { description: The proxy, video/mp4 }
        "206": { description: A range of it }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
  /web/items/{itemId}/full:
    get:
      tags: [web]
      summary: "The still at full resolution for 100 % zoom (0.8.1, ADR 0018 \"Full resolution\"): the original, or a JPEG made on demand"
      description: >-
        A JPEG photo or a pair's camera JPEG is answered as the file itself (X-Hoard-Full: original). A HEIF rendering
        (converted) or a lone RAW (raw: its full-size embedded JPEG, else a LibRaw decode) is made on demand in the
        preview queue's full-resolution lane and cached (bounded by --full-cache-mb); 202 with Retry-After while it is
        made.
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: "The image (image/jpeg for a made one); header X-Hoard-Full: original | converted | raw"
        "206": { description: A range of it }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
        "503": { description: "The NAS file is offline or changed (Retry-After), or previews are off" }
  /web/items/{itemId}/files/{fingerprint}:
    get:
      tags: [web]
      summary: One member file of the item (inline, or an attachment with download=1), with ranges
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: fingerprint
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Fingerprint" }
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { description: "The file; Content-Type by extension, Content-Disposition with its name (filename and filename*=UTF-8'')" }
        "206": { description: A range of it }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The NAS file is offline or changed since it was indexed (Retry-After) }
  /web/items/{itemId}/files/{fingerprint}/{name}:
    get:
      tags: [web]
      summary: "As /files/{fingerprint} (0.8.1): the file's name ends the URL so a browser naming a download by its URL keeps it; the name is ignored"
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: fingerprint
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Fingerprint" }
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { description: "The file; Content-Type by extension, Content-Disposition with its name" }
        "206": { description: A range of it }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The NAS file is offline or changed since it was indexed (Retry-After) }
  /web/culling:
    post:
      tags: [web]
      summary: As POST /v1/culling, written by the session's writer id (web:<16 hex>)
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/WebCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/CullChange" }
      responses:
        "200":
          description: As POST /v1/culling
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CullResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /web/downloads:
    post:
      tags: [web]
      summary: A zip download link for items (valid 10 minutes, this session only)
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/WebCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, examples: ["/web/downloads/3f2a…/Snow-3%20photos.zip"] }
                  name: { type: string, examples: ["Snow-3 photos.zip", "DSC01000.zip", "2024-05-03–2024-05-10-12 photos.zip"] }
                  items: { type: integer }
                  files: { type: integer }
                  bytes: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /web/downloads/{token}:
    get:
      tags: [web]
      summary: "The zip: every file of every item, stored (no compression), streamed; unreadable files listed in missing.txt"
      security: [{ webSession: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: application/zip }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /web/downloads/{token}/{name}:
    get:
      tags: [web]
      summary: "As /web/downloads/{token} (0.8.1): the zip's name ends the URL; the name is ignored"
      security: [{ webSession: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: application/zip }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    deviceKey:
      type: http
      scheme: bearer
      description: "Device key from POST /v1/pair: rvk1_<keyId>_<secret>."
    webSession:
      type: apiKey
      in: cookie
      name: hoard_web
      description: "Web gallery session (POST /web/session with the admin password; ADR 0018). LAN/Tailscale only."
  parameters:
    WebCsrf:
      name: X-Hoard-Web
      in: header
      required: true
      description: "1 on every state-changing /web/ call (a cross-site form cannot set it)."
      schema: { type: string, enum: ["1"] }
    Range:
      name: Range
      in: header
      schema: { type: string, examples: ["bytes=0-1048575"] }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    PreviewSize:
      name: size
      in: query
      schema: { type: string, enum: [thumb, screen], default: thumb }
    PreviewFormat:
      name: format
      in: query
      description: JPEG (default, decodes everywhere) or WebP (about a third smaller at the same SSIM; ADR 0015 "Formats").
      schema: { type: string, enum: [jpeg, webp], default: jpeg }
    PreviewVersion:
      name: v
      in: query
      description: The preview's key (X-Hoard-Preview-Version, or `v` from POST /v1/items/previews); makes the answer immutable when it is the current one.
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
  responses:
    Bytes:
      description: The bytes (application/octet-stream; ETag, Accept-Ranges)
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    PartialBytes:
      description: The requested range
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    BadRequest:
      description: "`invalid_request` or `invalid_json`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthorized`: missing, malformed, unknown or revoked key"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Missing X-Hoard-Web header or a cross-origin request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: "`too_large`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: "`unsupported_media_type`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: "`invalid_request` or `checksum_mismatch`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreviewImage:
      description: The JPEG (image/jpeg) or WebP (image/webp)
      headers:
        ETag: { schema: { type: string } }
        X-Hoard-Preview-Version: { schema: { type: string }, description: The content key (source + recipe + PREVIEW_VERSION) }
        X-Hoard-Preview: { schema: { type: string, enum: [ready, stale] } }
      content:
        image/jpeg:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
    PreviewPending:
      description: Not made yet; queued ahead of the backlog. Ask again after Retry-After seconds.
      headers:
        Retry-After: { schema: { type: integer } }
        X-Hoard-Preview: { schema: { type: string, const: pending } }
      content:
        application/json:
          schema:
            type: object
            required: [status, retryAfter]
            properties:
              status: { type: string, const: pending }
              retryAfter: { type: integer }
    PreviewNotFound:
      description: >-
        `not_found` (no such live item) or `preview_unavailable` with `details.reason`: `not_applicable` (a poster of a
        still, a proxy of a photo), `unsupported` (no decoder for the file), `failed` (generation failed three times),
        `no_tools`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`"
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Uuid:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Fingerprint:
      type: string
      pattern: "^v1:[0-9a-f]{64}$"
      description: "v1: + SHA-256 over size (8 bytes BE), first 1 MiB, last 1 MiB (whole file when <= 2 MiB). Reveal ADR 0006."
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Kind:
      type: string
      enum: [photo, version, preset, setting]
    Record:
      type: object
      required: [kind, id, rev, deleted, modifiedAt, deviceId, data]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        id: { type: string }
        rev: { type: integer }
        deleted: { type: boolean }
        modifiedAt: { type: integer, description: Unix ms, device clock }
        deviceId: { $ref: "#/components/schemas/Uuid" }
        copyOf:
          description: Version only; the version this one is the conflict copy of.
          $ref: "#/components/schemas/Uuid"
        data:
          oneOf:
            - type: object
            - type: "null"
    Change:
      type: object
      required: [kind, id, baseRev, modifiedAt]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        id:
          type: string
          description: A UUID for photo/version/preset; `[a-z0-9][a-z0-9._-]{0,63}` for a setting.
        baseRev: { type: integer, minimum: 0, description: rev of the state edited; 0 for a new record }
        modifiedAt: { type: integer, minimum: 1 }
        deleted: { type: boolean, default: false }
        data:
          type: object
          description: |
            Required unless deleted; at most 2 MiB. A photo needs `fingerprint`; a version needs `photoId`
            (and carries `position`, `name`, `recipe` (Reveal ADR 0003), `history`, `cursor`).
    Result:
      type: object
      required: [kind, id, status, rev]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        id: { type: string }
        status: { type: string, enum: [applied, conflict] }
        rev: { type: integer, description: The record's current rev after this change }
        winner: { type: string, enum: [incoming, server] }
        copyId: { $ref: "#/components/schemas/Uuid" }
    UploadState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [exists, created, resume] }
        uploadId: { $ref: "#/components/schemas/Uuid" }
        offset: { type: integer }
        chunkSize: { type: integer }
        expiresAt: { type: integer, description: Unix ms }
    NasFile:
      type: object
      required: [fingerprint, folderId, folderName, path, size, modifiedAt, removed]
      properties:
        fingerprint:
          oneOf:
            - $ref: "#/components/schemas/Fingerprint"
            - type: "null"
        folderId: { $ref: "#/components/schemas/Uuid" }
        folderName: { type: string }
        path: { type: string, description: "Relative to the folder, /-separated" }
        size: { type: integer }
        modifiedAt: { type: integer }
        removed: { type: boolean }
    Counts:
      type: object
      properties:
        devices: { type: integer }
        photos: { type: integer }
        versions: { type: integer }
        blobs: { type: integer }
        nasFiles: { type: integer }
        pendingUploads: { type: integer }
        items: { type: integer, description: "Live items (hoard-server 0.5.0)" }
    ServerInfo:
      type: object
      required: [serverId, serverName, version, api, deviceId, limits, storageConfigured]
      properties:
        serverId: { $ref: "#/components/schemas/Uuid" }
        serverName: { type: string }
        version: { type: string }
        api: { type: integer, const: 1 }
        deviceId: { $ref: "#/components/schemas/Uuid" }
        storageConfigured: { type: boolean }
        features:
          type: array
          description: >-
            Optional parts of the API this server has (hoard-server 0.5.0; absent before). `items` = ADR 0014,
            `previews` = ADR 0015 (0.6.0), `culling` = ADR 0016 and `device-identity` = ADR 0017 (0.7.0). Clients
            ignore names they do not know.
          items: { type: string, enum: [items, previews, culling, device-identity] }
        previews:
          type: object
          description: Present when the server makes previews (ADR 0015). Not in limits, which is reveal-sync's.
          properties:
            version: { type: integer, description: PREVIEW_VERSION }
            thumbEdge: { type: integer }
            screenEdge: { type: integer }
            proxyShortEdge: { type: integer }
            maxWarm: { type: integer }
            requestsPerSecond: { type: integer }
            requestBurst: { type: integer }
        limits:
          type: object
          properties:
            maxJsonBody: { type: integer }
            maxRecordData: { type: integer }
            maxPushChanges: { type: integer }
            maxPullLimit: { type: integer }
            maxLookup: { type: integer }
            chunkSize: { type: integer }
            maxBlobSize: { type: integer }
            maxUploadsPerDevice: { type: integer }
            requestsPerSecond: { type: integer }
            requestBurst: { type: integer }
    PreviewState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, pending, unavailable] }
        v: { type: string, description: "ready: the key for ?v=" }
        stale: { type: boolean, description: "ready, but an older preview; a new one is queued" }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer, description: "the JPEG's (the MP4's for a proxy)" }
        webpBytes: { type: integer, description: "thumb and screen: the WebP's" }
        reason: { type: string, enum: [not_applicable, unsupported, failed, no_tools] }
    Role:
      type: string
      enum: [raw, rendered, video, sidecar]
    Capture:
      type: object
      required: [source]
      description: ADR 0014 "Capture time".
      properties:
        local: { type: string, description: "Wall clock, 2006-01-02T15:04:05[.000]" }
        offset: { type: string, description: "UTC offset of local, +09:00" }
        utc: { type: integer, description: "The instant, Unix ms, when known" }
        source: { type: string, enum: [exif, exif-gps, quicktime, mtime, upload] }
    Gps:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
        alt: { type: number }
    VideoInfo:
      type: object
      properties:
        durationMs: { type: integer }
        container: { type: string }
        codec: { type: string }
        profile: { type: string }
        width: { type: integer }
        height: { type: integer }
        rotation: { type: integer, enum: [0, 90, 180, 270], description: "Clockwise, to apply for display" }
        fps: { type: number }
        bitDepth: { type: integer }
        hdr: { type: string, enum: [pq, hlg, dolby-vision] }
        colorSpace: { type: string }
        audio: { type: string }
    ItemLocation:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [nas, backup] }
        folderId: { $ref: "#/components/schemas/Uuid" }
        folderName: { type: string }
        path: { type: string, description: "nas: relative to the folder, /-separated" }
        modifiedAt: { type: integer, description: "nas: the file's mtime, Unix ms" }
        sha256: { type: string, description: "backup: the uploaded blob" }
    ItemFile:
      type: object
      required: [fingerprint, role, size, locations]
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        role: { $ref: "#/components/schemas/Role" }
        name: { type: string }
        format: { type: string, description: "Content format: jpeg, heif, tiff, cr3, raf, mp4, mov, xmp, …" }
        size: { type: integer }
        locations:
          type: array
          items: { $ref: "#/components/schemas/ItemLocation" }
    Item:
      type: object
      required: [id, rev, deleted, createdAt, updatedAt]
      description: |
        One shot (ADR 0014). A tombstone (`deleted: true`) carries only `id`, `rev`, `deleted`, the timestamps and
        `replacedBy` when another item took its main file over. Unknown fields are ignored by clients.
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        rev: { type: integer }
        deleted: { type: boolean }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        replacedBy: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [photo, pair, video, motion] }
        mainFingerprint: { $ref: "#/components/schemas/Fingerprint" }
        sortTime: { type: integer, description: "capture.utc, else the wall clock read as UTC, else 0" }
        capture: { $ref: "#/components/schemas/Capture" }
        make: { type: string }
        model: { type: string }
        lensMake: { type: string }
        lens: { type: string }
        gps: { $ref: "#/components/schemas/Gps" }
        width: { type: integer }
        height: { type: integer }
        orientation: { type: integer, minimum: 1, maximum: 8, description: "EXIF orientation of the still" }
        video: { $ref: "#/components/schemas/VideoInfo" }
        motion:
          type: object
          required: [source, fingerprint]
          properties:
            source: { type: string, enum: [file, embedded] }
            fingerprint: { $ref: "#/components/schemas/Fingerprint" }
            format: { type: string, enum: [google, microvideo, samsung] }
            offset: { type: integer }
            length: { type: integer }
            presentationUs: { type: integer }
        files:
          type: array
          items: { $ref: "#/components/schemas/ItemFile" }
    CullValue:
      description: "rating: integer 0..5; flag: pick | reject | none; label: a string of at most 64 characters (\"\" = none)"
      oneOf:
        - { type: integer, minimum: 0, maximum: 5 }
        - { type: string, maxLength: 64 }
    CullChange:
      type: object
      description: Exactly one of itemId and fingerprint.
      required: [field, value, baseRev, modifiedAt]
      properties:
        itemId: { $ref: "#/components/schemas/Uuid" }
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        field: { type: string, enum: [rating, flag, label] }
        value: { $ref: "#/components/schemas/CullValue" }
        baseRev: { type: integer, minimum: 0, description: "The field's rev the device last saw; 0 = never seen." }
        modifiedAt: { type: integer, description: "When the user made the change, Unix ms, the device's clock." }
    CullResult:
      type: object
      description: |
        The outcome of one change. `applied` / `unchanged` / `conflict` carry `itemId` and `rev`; `invalid` carries
        `code` and `message` and echoes the `itemId` or `fingerprint` and `field` it was sent with (no `rev`).
      required: [index, field, status]
      properties:
        index: { type: integer, description: "The change's position in `changes`." }
        itemId: { $ref: "#/components/schemas/Uuid" }
        fingerprint: { type: string, description: "Only on `invalid`, as sent." }
        field: { type: string, description: "rating, flag or label (on `invalid`: as sent)" }
        status: { type: string, enum: [applied, unchanged, conflict, invalid] }
        winner: { type: string, enum: [incoming, server] }
        rev: { type: integer }
        clipped: { type: boolean }
        code:
          type: string
          enum: [invalid_target, invalid_field, invalid_value, label_too_long, invalid_base_rev, invalid_modified_at, unknown_item]
        message: { type: string, description: "English, for logs." }
    CullField:
      type: object
      required: [value, rev, modifiedAt, deviceId]
      properties:
        value: { $ref: "#/components/schemas/CullValue" }
        rev: { type: integer }
        modifiedAt: { type: integer }
        deviceId: { type: string, description: "A device id, or `nas` for a value imported from a NAS sidecar." }
    Culling:
      type: object
      description: |
        An item's culling record; fields never written are absent. A client maps it to its photos by any of
        `fingerprints` (else by the id derived from its main fingerprint when `fingerprints` is empty) and follows
        `replacedBy` (ADR 0016 "Mapping a record").
      required: [itemId, rev, fingerprints]
      properties:
        itemId: { $ref: "#/components/schemas/Uuid" }
        rev: { type: integer, description: "Its newest change in the feed: a field write, or its item's members changing." }
        fingerprints:
          type: array
          items: { $ref: "#/components/schemas/Fingerprint" }
          description: The item's member files, main first; empty when the server has no live item with this id.
        replacedBy: { $ref: "#/components/schemas/Uuid", description: "The live item that took a replaced item over." }
        rating: { $ref: "#/components/schemas/CullField" }
        flag: { $ref: "#/components/schemas/CullField" }
        label: { $ref: "#/components/schemas/CullField" }
    AppName:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 32
      examples: [hoard, reveal, reveal-debug, reveal-bench, hoard-debug]
      description: |
        Which app this device is, with its build variant when it is not the release (ADR 0017; 0.7.0). Variants are
        distinct apps of one physical device.
    DeviceEntry:
      type: object
      required: [id, name, app, platform, manufacturer, model]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        app: { type: [string, "null"] }
        platform: { type: string }
        manufacturer: { type: [string, "null"] }
        model: { type: [string, "null"] }
    Candidate:
      type: object
      required: [physicalDeviceId, name, match, devices]
      properties:
        physicalDeviceId: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        match: { type: string, enum: [model, other] }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceEntry" }
    DeviceView:
      type: object
      required: [deviceId, name, platform, app, manufacturer, model, features, physicalDevice, candidates]
      properties:
        deviceId: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        platform: { type: string }
        app: { type: [string, "null"] }
        manufacturer: { type: [string, "null"] }
        model: { type: [string, "null"] }
        features:
          type: array
          items: { type: string }
          description: Capabilities the device declared or was seen using (ADR 0016), e.g. `culling`.
        physicalDevice:
          type: object
          required: [id, name, devices]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            name: { type: string }
            devices:
              type: array
              items: { $ref: "#/components/schemas/DeviceEntry" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }
    LibraryRow:
      type: object
      description: One item in the web gallery's index (ADR 0018); absent fields are empty.
      required: [id, t, k, n]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        t: { type: integer, format: int64, description: sortTime, ms }
        l: { type: integer, format: int64, description: "The camera's wall clock read as UTC, when it differs from t" }
        k: { type: string, enum: [photo, pair, video, motion] }
        w: { type: integer, description: upright width }
        h: { type: integer, description: upright height }
        "n": { type: string, description: "main file's name" }
        fo: { type: string, description: NAS folder id (absent = uploaded by a device) }
        d: { type: string, description: directory in the folder }
        cam: { type: string, description: make and model as one name }
        lens: { type: string }
        raw: { type: boolean, description: the main file is a RAW }
        dur: { type: integer, description: video duration, ms }
        r: { type: integer, minimum: 1, maximum: 5 }
        x: { type: string, enum: [pick, reject] }
        lb: { type: string }
        e: { type: boolean, description: edited in Reveal }
        v: { type: string, description: "image preview key on disk (?v= for immutable URLs)" }
        cr: { type: string, description: "culling field revisions rating.flag.label" }
        size: { type: integer, format: int64, description: bytes of all files }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_cursor, invalid_json, unauthorized, invalid_pairing_token, forbidden, not_found,
                method_not_allowed, offset_mismatch, upload_busy, conflict, too_large, unsupported_media_type,
                invalid_change, checksum_mismatch, rate_limited, internal, storage_not_configured, unavailable]
            message: { type: string }
            details: { type: object }
