openapi: 3.1.0
info:
  title: hoard-server device API
  version: "1"
  summary: Sync of Reveal edits, library metadata, smart previews and original backups with a self-hosted server.
  description: |
    The normative description is ADR 0013 (docs/adr/0013-server-protocol.md in the Hoard repository; formerly Reveal
    ADR 0017); where this file and the ADR differ, the ADR wins. Every request except `GET /v1/health` and `POST /v1/pair` needs `Authorization: Bearer <device key>`.
    Errors are always `{"error": {"code", "message", "details"?}}` (see `Error`).
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: "{server}"
    variables:
      server:
        default: http://192.168.1.10:3071
        description: The address from the pairing QR code (any reveal-sync server).
security:
  - deviceKey: []
tags:
  - name: server
  - name: pairing
  - name: changes
  - name: blobs
  - name: originals
  - name: nas
  - name: items
  - name: previews
  - name: culling
  - name: edits
  - name: devices
  - name: backup
    description: Phone backup (ADR 0024, hoard-server 0.12.0).
  - name: web
    description: The web gallery's API (ADR 0018), outside /v1.
paths:
  /v1/health:
    get:
      tags: [server]
      summary: Liveness and counts (no names or paths)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version, api, counts]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                  api: { type: integer, const: 1 }
                  counts: { $ref: "#/components/schemas/Counts" }
  /v1/server:
    get:
      tags: [server]
      summary: Server identity and the limits that apply
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/pair:
    post:
      tags: [pairing]
      summary: Exchange a one-time pairing token (from the QR code) for this device's key
      description: |
        The QR code holds `revealsync://pair?v=1&url=<server URL>&token=<token>&server=<serverId>`. Tokens are valid
        for 10 minutes and once. The key in the answer is shown only here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, deviceName]
              properties:
                token: { type: string, maxLength: 100 }
                deviceName: { type: string, minLength: 1, maxLength: 100 }
                platform: { type: string, maxLength: 40, examples: [android] }
                appVersion: { type: string, maxLength: 40 }
                app: { $ref: "#/components/schemas/AppName" }
                manufacturer: { type: string, maxLength: 64, description: "Build.MANUFACTURER (ADR 0017; 0.7.0)" }
                model: { type: string, maxLength: 64, description: "Build.MODEL (ADR 0017; 0.7.0)" }
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, apiKey, serverId, serverName]
                properties:
                  deviceId: { $ref: "#/components/schemas/Uuid" }
                  apiKey: { type: string, pattern: "^rvk1_[0-9a-f]{16}_[A-Za-z0-9_-]{43}$" }
                  serverId: { $ref: "#/components/schemas/Uuid" }
                  serverName: { type: string }
                  physicalDeviceId:
                    $ref: "#/components/schemas/Uuid"
                    description: The physical device this new device starts in (its own deviceId). ADR 0017; 0.7.0.
                  candidates:
                    type: array
                    description: Physical devices this one may be (same model first). ADR 0017; 0.7.0.
                    items: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_pairing_token`: unknown, used or expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/changes:
    get:
      tags: [changes]
      summary: Records changed since a cursor, oldest first, each once at its latest state
      parameters:
        - name: cursor
          in: query
          description: Opaque; empty or absent = from the start.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: A page of the feed
          content:
            application/json:
              schema:
                type: object
                required: [changes, cursor, hasMore]
                properties:
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/Record" }
                  cursor: { type: string }
                  hasMore: { type: boolean }
        "400":
          description: "`invalid_cursor` (pull from the start) or `invalid_request`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [changes]
      summary: Push up to 500 changes (all validated first; applied in order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/Change" }
      responses:
        "200":
          description: One result per change, in order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Result" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: "`invalid_change`; `details.index` names the change. Nothing was applied."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/fingerprints/lookup:
    post:
      tags: [originals]
      summary: Which of these files can the server already reach (NAS or backup)?
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprints]
              properties:
                fingerprints:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/Fingerprint" }
      responses:
        "200":
          description: Found and missing fingerprints
          content:
            application/json:
              schema:
                type: object
                required: [found, missing]
                properties:
                  found:
                    type: array
                    items:
                      type: object
                      required: [fingerprint, size, source]
                      properties:
                        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
                        size: { type: integer }
                        source: { type: string, enum: [nas, backup] }
                        sha256: { $ref: "#/components/schemas/Sha256" }
                  missing:
                    type: array
                    items: { $ref: "#/components/schemas/Fingerprint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/originals/{fingerprint}:
    get:
      tags: [originals]
      summary: A photo file by fingerprint (NAS or uploaded); Range and HEAD supported
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Fingerprint" }
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { $ref: "#/components/responses/Bytes" }
        "206": { $ref: "#/components/responses/PartialBytes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: "`unavailable`: the NAS file changed since it was indexed or the share is offline (Retry-After)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [originals]
      summary: Delete the uploaded original of a fingerprint once no live photo record names it
      description: >-
        The user deleted the photo from the server (0.5.3). Any paired device may ask, after pushing the photo's
        tombstone: a photo record that is not deleted and names the fingerprint (its main file or any file of the shot)
        keeps it. The check and the delete are atomic; the blob's file goes when no other fingerprint uses its bytes.
        Indexed NAS files are never deleted.
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Fingerprint" }
      responses:
        "204": { description: The uploaded original is gone }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden`, `details.reason` = `nas`: the file is in an indexed NAS folder"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict`, `details.reason` = `referenced`: a live photo record still names it; or (0.12.0, ADR 0024)
            `mirror`: a phone backup entry (current, deleted or freed) names the file. Nothing is deleted; the calling
            device's claim on it is released, so the bytes go when the backup no longer needs them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/blobs/{sha256}:
    get:
      tags: [blobs]
      summary: A blob by its SHA-256; Range and HEAD supported
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Sha256" }
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { $ref: "#/components/responses/Bytes" }
        "206": { $ref: "#/components/responses/PartialBytes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [blobs]
      summary: Drop a smart preview this device uploaded once no live photo record names it
      description: >-
        Only `preview` blobs, only by the device that uploaded them, and only when no photo record that is not deleted
        names the blob in `data.preview.sha256` (push the record without it first). The check and the delete are
        atomic. Originals are never dropped by a device.
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Sha256" }
      responses:
        "204": { description: The preview is gone }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden`: `details.reason` is `original` (not a preview) or `other_device` (not this device's)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`, `details.reason` = `referenced`: a live photo record still names it"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/uploads:
    post:
      tags: [blobs]
      summary: Start (or find again) a chunked upload of a blob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, size, kind]
              properties:
                sha256: { $ref: "#/components/schemas/Sha256" }
                size: { type: integer, minimum: 1, maximum: 4294967296 }
                kind: { type: string, enum: [original, preview] }
                fingerprint:
                  description: Required for an original, absent for a preview.
                  $ref: "#/components/schemas/Fingerprint"
                wait:
                  type: boolean
                  default: false
                  description: >-
                    hoard-server 0.12.0 (ADR 0024). When another device has an unfinished upload of the same sha256 that
                    received a chunk (or was made) in the last 10 minutes, answer `200 {"status": "in_progress",
                    "retryAfter": 300}` with `Retry-After` instead of starting a second, parallel upload. A stalled
                    upload blocks nobody. Without it nothing changes.
                claim:
                  type: boolean
                  default: true
                  description: >-
                    hoard-server 0.12.0 (ADR 0024 "Ownership"). `false`: the upload is for the phone backup only and adds
                    no device claim on the original (Hoard's backup sends it); absent or `true`: the device claims it
                    (Reveal), as every upload did before.
      responses:
        "200":
          description: "`exists` (nothing to send), `resume` (an unfinished upload of this device) or, with `wait`, `in_progress` (0.12.0)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "201":
          description: "`created`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`storage_not_configured`: no backup folder chosen on the server"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    head:
      tags: [blobs]
      summary: Where an upload stands
      responses:
        "204":
          description: Upload-Offset and Upload-Length headers
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
        "404": { description: No such upload for this device }
    patch:
      tags: [blobs]
      summary: Append the next chunk (at most chunkSize bytes) at Upload-Offset
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: "Stored. `Upload-Complete: 1` when this chunk finished and verified the blob."
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
            Upload-Complete: { schema: { type: string, const: "1" } }
        "400":
          description: "`invalid_request`: missing header, or the chunk was interrupted (bytes that arrived are kept; HEAD and continue)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`offset_mismatch` (`details.offset` is the server's) or `upload_busy`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: "`checksum_mismatch`: the bytes do not match sha256 or fingerprint; the upload restarts at 0"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [blobs]
      summary: Abandon an upload
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/devices:
    get:
      tags: [devices]
      summary: The paired devices that are not revoked (to name the device of a conflict copy)
      responses:
        "200":
          description: Devices, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      required: [id, name, platform]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        platform: { type: string }
                        physicalDeviceId: { type: string, description: "ADR 0017; 0.7.0" }
                        app: { type: [string, "null"], description: "ADR 0017; 0.7.0" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/device:
    get:
      tags: [devices]
      summary: This device, its physical device and the physical devices it may be (ADR 0017; hoard-server 0.7.0)
      responses:
        "200":
          description: The device view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [devices]
      summary: Report this device's app, manufacturer, model and capabilities (ADR 0017; hoard-server 0.7.0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app: { $ref: "#/components/schemas/AppName" }
                manufacturer: { type: string, maxLength: 64 }
                model: { type: string, maxLength: 64 }
                features:
                  type: array
                  maxItems: 16
                  items: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
                  description: |
                    Capabilities the app implements (ADR 0016). Known ones are recorded, unknown ones ignored, and a
                    recorded one is never removed. `culling`: the device syncs culling per field, so the server stops
                    bridging the culling fields of its photo records. `freed-adopt` (0.12.0, ADR 0024): the app adopts
                    a photo the phone freed; a live Reveal that declared it opens Hoard's free-up gate.
      responses:
        "200":
          description: The device view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/device/claim:
    post:
      tags: [devices]
      summary: Move this device into a physical device, or (null) into one of its own (ADR 0017; hoard-server 0.7.0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [physicalDeviceId]
              properties:
                physicalDeviceId: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The device view after the move
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict` with `details.reason = same_app`: that physical device already has a live device of this app id (build variant included)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/nas/files:
    get:
      tags: [nas]
      summary: The files the server indexes on its NAS folders, as a feed
      description: |
        Photos only. Since 0.11.0 (ADR 0023) files in a `.hoard-trash` folder never appear: a file moved to a trash is
        its original row with `removed: true` and `trashed: true`; a restore is `removed: false` at the same path with
        the same fingerprint; a purge (the trash copy gone) sends the row again with `removed: true` and no `trashed`.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: A page of the NAS feed
          content:
            application/json:
              schema:
                type: object
                required: [files, cursor, hasMore]
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/NasFile" }
                  cursor: { type: string }
                  hasMore: { type: boolean }
        "400":
          description: "`invalid_cursor`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/nas/walk:
    post:
      tags: [nas]
      summary: "Walk these NAS folders soon (hoard-server 0.11.0, ADR 0023)"
      description: |
        Hoard asks for a walk after it moved files into or out of a folder's `.hoard-trash`, so the items follow
        without waiting for the scheduled walk. Coalesced: a folder already queued is not queued again (one being
        walked is queued once more). Server-wide budget, whoever asks: a requested walk of a folder starts at least
        1 minute after the previous requested walk of it and 10 s after any walk of it; the answer is still `202`,
        with `deferred` giving when such a folder's walk may start (more requests meanwhile change nothing). Per
        device: a burst of 6 requests, then one per 10 s; beyond that `429 rate_limited` with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folders]
              properties:
                folders:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/Uuid" }
      responses:
        "202":
          description: The folders are queued (each once)
          content:
            application/json:
              schema:
                type: object
                required: [queued, deferred]
                properties:
                  queued:
                    type: array
                    items: { $ref: "#/components/schemas/Uuid" }
                  deferred:
                    type: object
                    description: The queued folders whose walk waits for the budget, with when it may start (Unix ms); empty when none
                    additionalProperties: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_found`: a folder the server does not index (unknown or removed); `details.folder` names it; nothing is queued"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/changes:
    get:
      tags: [items]
      summary: The items feed (ADR 0014; hoard-server 0.5.0)
      description: |
        Every item whose revision is greater than the cursor, once, at its latest state, oldest revision first.
        Tombstones (`deleted: true`) are kept forever. Own revision counter and cursors (not interchangeable with
        `/v1/changes` or `/v1/nas/files`). Since 0.7.0 (ADR 0016) culling records share the counter and come with
        `include=culling`; `limit` then counts items plus culling records.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: include
          in: query
          description: |
            Comma-separated `items`, `culling` (ADR 0016; 0.7.0) and `trash` (ADR 0023; 0.11.0). Absent = `items`;
            `trash` alone = `items,trash`. Without `trash`, a trashed item is served as a tombstone and a live item
            lists only its live locations (a member file with every location in a trash is left out); with it, a
            trashed item is served whole with `deleted: false` and `trashed`, and locations in a trash carry `trash`.
          schema: { type: string, default: items, examples: ["items,culling", culling, "items,culling,trash"] }
      responses:
        "200":
          description: A page of the items feed
          content:
            application/json:
              schema:
                type: object
                required: [items, cursor, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  culling:
                    type: array
                    description: With include=culling only.
                    items: { $ref: "#/components/schemas/Culling" }
                  cursor: { type: string }
                  hasMore: { type: boolean }
        "400":
          description: "`invalid_cursor`, `invalid_request`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/items:
    get:
      tags: [items]
      summary: Live items in capture-time order, filtered (ADR 0014; hoard-server 0.5.0)
      description: |
        A query, not a change feed: live items only, ordered by `sortTime` then `id`, paged with a keyset cursor
        that is only valid with the same `order`. Repeat the same filters with each cursor. Trashed items (ADR 0023)
        are left out; `trashed=only` lists them instead, in the `include=trash` shape.
      parameters:
        - name: trashed
          in: query
          description: "`only`: the trashed items instead of the live ones (0.11.0, ADR 0023); `folder` and `path` then match their original directory."
          schema: { type: string, enum: [only] }
        - name: kind
          in: query
          description: Comma-separated kinds.
          schema: { type: string, example: "photo,pair" }
        - name: from
          in: query
          description: "`sortTime` at least this (Unix ms)."
          schema: { type: integer }
        - name: to
          in: query
          description: "`sortTime` below this (Unix ms)."
          schema: { type: integer }
        - name: folder
          in: query
          description: >-
            A NAS folder id (`folderId` of a location) or (0.12.0, ADR 0024) a phone backup root id (`rootId` of a
            mirror location): then the items with a mirror location under the root, including locations with
            `onDevice: false`; this is also the lookup by mirror location (match `volume` and `path`, confirm with the
            file's `size` and the location's `modifiedAt`).
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: path
          in: query
          description: With `folder`, a directory relative to it (to the root for a backup root; '/'-separated, no leading or trailing '/'); its sub-directories are included.
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [desc, asc], default: desc }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema:
                type: object
                required: [items, cursor, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  cursor:
                    description: The next page's cursor; null on the last page.
                    oneOf:
                      - type: string
                      - type: "null"
                  hasMore: { type: boolean }
        "400":
          description: "`invalid_request`, `invalid_cursor`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/items/{itemId}:
    get:
      tags: [items]
      summary: One item (a tombstone too)
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: include
          in: query
          description: "`trash` (0.11.0, ADR 0023): a trashed item whole, with its locations in a trash; without it, a trashed item is a tombstone."
          schema: { type: string, enum: [trash] }
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/items/lookup:
    post:
      tags: [items]
      summary: The live items that have any of these fingerprints as a member file
      description: |
        Without `include: ["trash"]` (0.11.0, ADR 0023), the fingerprints of trashed items, and of member files whose
        every location is in a trash, are in `missing`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprints]
              properties:
                fingerprints:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/Fingerprint" }
                include:
                  type: array
                  description: "`trash` (0.11.0): trashed items match too, served whole"
                  items: { type: string, enum: [trash] }
      responses:
        "200":
          description: Matches, the items they name (each once) and the fingerprints no item has
          content:
            application/json:
              schema:
                type: object
                required: [items, matches, missing]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  matches:
                    type: array
                    items:
                      type: object
                      required: [fingerprint, itemId, role]
                      properties:
                        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
                        itemId: { $ref: "#/components/schemas/Uuid" }
                        role: { $ref: "#/components/schemas/Role" }
                  missing:
                    type: array
                    items: { $ref: "#/components/schemas/Fingerprint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/items/by-path:
    post:
      tags: [items]
      summary: "The live items of the files at these paths of a NAS folder (hoard-server 0.10.0, ADR 0014 \"Items by path\")"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, paths]
              properties:
                folder: { $ref: "#/components/schemas/Uuid" }
                paths:
                  type: array
                  maxItems: 1000
                  items: { type: string, maxLength: 1024, description: "Relative to the folder, '/'-separated, no '..'; normalised by the server" }
      responses:
        "200":
          description: The paths with a live item (a tombstone's replacedBy followed once) and those without
          content:
            application/json:
              schema:
                type: object
                required: [found, missing]
                properties:
                  found:
                    type: array
                    items:
                      type: object
                      required: [path, itemId, role, size, modifiedAt]
                      properties:
                        path: { type: string, description: As sent }
                        itemId: { $ref: "#/components/schemas/Uuid" }
                        role: { $ref: "#/components/schemas/Role" }
                        size: { type: integer, format: int64 }
                        modifiedAt: { type: integer, format: int64, description: "Unix ms, the NAS file's modification time" }
                  missing:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/items/{itemId}/preview:
    get:
      tags: [previews]
      summary: An item's preview (thumb or screen, JPEG or WebP); a video's poster frame (ADR 0015)
      description: >-
        Upright sRGB JPEG, long edge at most 512 (thumb) or 2560 (screen) px, never upscaled, from the item's best
        source (a pair's camera JPEG, a RAW's embedded preview or a LibRaw decode, HEIF/AVIF; a video's first non-dark
        frame at 10/25/50 %). Not made yet: 202 with Retry-After after queueing it ahead of the backlog. Ready: the
        file with `ETag` and `X-Hoard-Preview-Version` (its content key); with `v` equal to that key the answer is
        `Cache-Control: private, max-age=31536000, immutable`, otherwise `private, no-cache` (revalidate: 304).
        `X-Hoard-Preview: stale` = an older preview (older recipe or source) served while the new one is made.
        HEAD and Range work. Its own per-device rate (200/s, burst 600), separate from the API's.
        With `edit` (hoard-server 0.9.0, ADR 0020): the same sizes made from Reveal's edited preview of that version
        (or of the item's primary edit), header `X-Hoard-Edit: <versionId>`; `404 preview_unavailable` with reason
        `no_edit` when the item has no such edit.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewSize"
        - $ref: "#/components/parameters/PreviewFormat"
        - $ref: "#/components/parameters/PreviewVersion"
        - $ref: "#/components/parameters/PreviewEdit"
      responses:
        "200": { $ref: "#/components/responses/PreviewImage" }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "304": { description: Not modified (If-None-Match) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{itemId}/poster:
    get:
      tags: [previews]
      summary: A video item's poster frame (thumb or screen); the same file as /preview of a video
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewSize"
        - $ref: "#/components/parameters/PreviewFormat"
        - $ref: "#/components/parameters/PreviewVersion"
      responses:
        "200": { $ref: "#/components/responses/PreviewImage" }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "304": { description: Not modified (If-None-Match) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{itemId}/proxy:
    get:
      tags: [previews]
      summary: The low-bitrate proxy of a video or of a motion photo's video; Range and HEAD supported
      description: >-
        MP4 (faststart): H.264 High, short edge at most 720 px, at most 30 fps, a keyframe every 2 s, capped CRF
        (at most 2.5 Mb/s), AAC stereo 128 kb/s; HDR (PQ, HLG, Dolby Vision's base layer) tone-mapped to SDR BT.709.
        Same caching and 202 rules as /preview.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewVersion"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: The proxy (video/mp4)
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: The requested range
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "304": { description: Not modified (If-None-Match) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/previews:
    post:
      tags: [previews]
      summary: The preview states of up to 500 items; queues the ones not made (a gallery warming a screen)
      description: >-
        Queued at the "warm" priority (after a client waiting on a GET, before recently added items and the backlog);
        the first item of the list first. `v` of a ready preview builds an immutable URL (`?v=`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/Uuid" }
                previews:
                  type: array
                  description: Which previews (default thumb).
                  items: { type: string, enum: [thumb, screen, proxy] }
                edit:
                  type: string
                  description: >-
                    (0.9.0, ADR 0020) thumb and screen of this edit: a Reveal version id, or `primary`. An item without
                    it answers them `unavailable` with reason `no_edit`; proxy is unaffected.
      responses:
        "200":
          description: Per item (each once, in the order asked), the state of each preview asked; unknown or deleted ids in missing
          content:
            application/json:
              schema:
                type: object
                required: [items, missing]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { $ref: "#/components/schemas/Uuid" }
                        edit: { $ref: "#/components/schemas/Uuid", description: "the version whose edit thumb and screen are (with edit)" }
                        thumb: { $ref: "#/components/schemas/PreviewState" }
                        screen: { $ref: "#/components/schemas/PreviewState" }
                        proxy: { $ref: "#/components/schemas/PreviewState" }
                  missing:
                    type: array
                    items: { $ref: "#/components/schemas/Uuid" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{itemId}/edits/{versionId}:
    put:
      tags: [edits]
      summary: "Store Reveal's edited preview of one version of an item (hoard-server 0.9.0, ADR 0020)"
      description: |
        The body is one sRGB JPEG or WebP rendered by Reveal from the version's recipe: upright pixels, long edge 16 to
        2560 px (min(2560, the edit's own long edge)), at most 8 MiB. The server decodes it whole, checks the size and
        the colour space (no ICC profile = sRGB; an sRGB or grey profile is accepted; any other profile, CMYK or an
        animated WebP is refused) and removes every metadata segment (EXIF, XMP, ICC, comments) without re-encoding.
        Metadata travels in headers. A version has one edit on the server; a PUT on another item moves it there.

        - The same `X-Hoard-Recipe-Digest` as the stored edit of the version: the stored image stays and the body is
          not read (send it empty, or with `Expect: 100-continue`); only label, primary, virtual copy and `editedAt`
          change (`updated`), or nothing (`unchanged`, no new revision).
        - A different digest needs the image (else `422` reason `image_required`); an `X-Hoard-Edited-At` older than
          the stored one is `409 conflict` (reason `older`, with the stored `editedAt` and `recipeDigest`). A time
          more than 10 minutes ahead of the server is clipped.
        - `X-Hoard-Primary: true` makes it the item's primary edit (at most one; the last set wins).

        Every change gives the item a new revision in the items feed (its `edits` array). Thumb and screen previews
        are made from the upload (`GET .../preview?edit=<versionId>`).

        A trashed item (0.11.0, ADR 0023) answers `404 not_found`, as a tombstone; `GET` and `DELETE` of its edits
        work, and its previews are kept.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/VersionId"
        - name: X-Hoard-Recipe-Digest
          in: header
          required: true
          description: "Reveal's digest of what was rendered (recipe + render pipeline); 1-128 of A-Z a-z 0-9 . _ : + / = -"
          schema: { type: string, maxLength: 128 }
        - name: X-Hoard-Edited-At
          in: header
          required: true
          description: When the version last changed on the device, Unix ms
          schema: { type: integer, format: int64 }
        - name: X-Hoard-Label
          in: header
          description: "The version's name, percent-encoded UTF-8, at most 64 characters (\"\" = none)"
          schema: { type: string }
        - name: X-Hoard-Virtual-Copy
          in: header
          schema: { type: boolean, default: false }
        - name: X-Hoard-Primary
          in: header
          schema: { type: boolean, default: false }
      requestBody:
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditWriteResult" }
        "200":
          description: "replaced (a new image), updated (metadata) or unchanged"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditWriteResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`, reason `older`: the server has a later edit of this version (details: editedAt, recipeDigest)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: >-
            `invalid_image` with details.reason `format`, `decode`, `dimensions`, `colour_space` or `animated`;
            `invalid_request` with reason `image_required`, `too_many_edits` (32 per item) or `not_applicable` (a video)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`unavailable`: previews (and so edits) are off on this server" }
    get:
      tags: [edits]
      summary: The stored upload of a version's edit (metadata removed); Range works
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/VersionId"
        - name: v
          in: query
          description: The edit's image SHA-256 (ETag) for an immutable answer
          schema: { type: string }
      responses:
        "200":
          description: "image/jpeg or image/webp; ETag the image's SHA-256, X-Hoard-Recipe-Digest"
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: Not modified (If-None-Match) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [edits]
      summary: Remove a version's edit from an item (idempotent)
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: "deleted, or absent (nothing to delete; a tombstoned item has none)"
          content:
            application/json:
              schema:
                type: object
                required: [status, itemId, rev]
                properties:
                  status: { type: string, enum: [deleted, absent] }
                  itemId: { $ref: "#/components/schemas/Uuid" }
                  rev: { type: integer, description: "the item's revision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/culling:
    post:
      tags: [culling]
      summary: Push culling changes, one field each (ADR 0016; hoard-server 0.7.0)
      description: |
        Applied in order in one transaction; per field: same value = unchanged, `baseRev` equal to the field's rev =
        applied, else last-writer-wins on `modifiedAt` then device id. A `modifiedAt` more than 10 minutes ahead of the
        server is clipped. A change that cannot be applied (validation, an unknown `itemId`, a label over 64
        characters) is a result with `status: invalid` and a `code`; the other changes apply and the answer is 200.
        Only a body that is not a push (malformed JSON, 0 or more than 500 changes) is refused. Calling it marks the
        device culling-aware (its photo records are no longer bridged).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  description: A change that does not match CullChange is an `invalid` result, not a 4xx.
                  items: { $ref: "#/components/schemas/CullChange" }
      responses:
        "200":
          description: One result per change, in order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CullResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/culling/{itemId}:
    get:
      tags: [culling]
      summary: One item's culling record (ADR 0016; hoard-server 0.7.0)
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Culling" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  # --- Web gallery (ADR 0018; hoard-server 0.8.0). LAN/Tailscale only (404 through a proxy), signed in with the admin
  # password (cookie `hoard_web`); writes need `X-Hoard-Web: 1`. Not for devices: the device API is /v1.
  /web/session:
    get:
      tags: [web]
      summary: Whether this browser is signed in to the gallery
      security: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                type: object
                required: [signedIn, setup, version]
                properties:
                  signedIn: { type: boolean }
                  setup: { type: boolean, description: No admin password yet (use the setup page). }
                  version: { type: string }
                  writer: { type: string, description: "The session's culling writer id, web:<16 hex>; empty when signed out." }
                  previews: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [web]
      summary: Sign in with the admin password (argon2id; 5 a minute per address)
      security: []
      parameters:
        - $ref: "#/components/parameters/WebCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Signed in; sets the HttpOnly, SameSite=Strict cookie `hoard_web` (Path=/web/, 7 days idle)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  writer: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: No admin password yet }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [web]
      summary: Sign out
      parameters:
        - $ref: "#/components/parameters/WebCsrf"
      responses:
        "200": { description: Signed out; the cookie is cleared }
        "403": { $ref: "#/components/responses/Forbidden" }
  /web/library:
    get:
      tags: [web]
      summary: The library index, whole or the changes since a cursor (ADR 0018 "Library index")
      security: [{ webSession: [] }]
      parameters:
        - name: cursor
          in: query
          description: "<boot>:<generation> from the last answer; empty, foreign or malformed = the whole index."
          schema: { type: string }
      responses:
        "200":
          description: Rows newest first; gzip when accepted
          content:
            application/json:
              schema:
                type: object
                required: [cursor, full, rows, removed, folders, total]
                properties:
                  cursor: { type: string }
                  full: { type: boolean }
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/LibraryRow" }
                  removed:
                    type: array
                    items: { $ref: "#/components/schemas/Uuid" }
                  folders:
                    type: object
                    additionalProperties: { type: string }
                    description: NAS folder id to name.
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /web/folders:
    get:
      tags: [web]
      summary: NAS folders with item counts per directory
      security: [{ webSession: [] }]
      responses:
        "200":
          description: Every NAS folder (empty ones too) and the items uploaded by devices
          content:
            application/json:
              schema:
                type: object
                required: [folders, uploads]
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      required: [id, name, state, items, dirs]
                      properties:
                        id: { $ref: "#/components/schemas/Uuid" }
                        name: { type: string }
                        state: { type: string, description: "pending, indexing, ready, error, unavailable, disabled, removed" }
                        items: { type: integer }
                        dirs:
                          type: array
                          items:
                            type: object
                            properties:
                              path: { type: string, description: '"" = the folder itself' }
                              items: { type: integer }
                  uploads: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /web/items/{itemId}:
    get:
      tags: [web]
      summary: One live item with its culling record and the edited-in-Reveal flag
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                type: object
                required: [item, culling, edited]
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  culling:
                    oneOf:
                      - { $ref: "#/components/schemas/Culling" }
                      - { type: "null" }
                  edited: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /web/items/{itemId}/exif:
    get:
      tags: [web]
      summary: Exposure read on demand from the item's still (not stored)
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Fields absent when not recorded (and for videos)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exposure:
                    type: object
                    properties:
                      exposureTime: { type: number, description: seconds }
                      fNumber: { type: number }
                      iso: { type: integer }
                      bias: { type: number, description: EV }
                      focalLength: { type: number, description: mm }
                      focalLength35: { type: integer, description: mm }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /web/items/{itemId}/preview:
    get:
      tags: [web]
      summary: As GET /v1/items/{itemId}/preview, with the gallery session (edit included)
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewSize"
        - $ref: "#/components/parameters/PreviewFormat"
        - $ref: "#/components/parameters/PreviewVersion"
        - $ref: "#/components/parameters/PreviewEdit"
      responses:
        "200": { $ref: "#/components/responses/PreviewImage" }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
  /web/items/{itemId}/poster:
    get:
      tags: [web]
      summary: As GET /v1/items/{itemId}/poster, with the gallery session
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewSize"
        - $ref: "#/components/parameters/PreviewFormat"
        - $ref: "#/components/parameters/PreviewVersion"
      responses:
        "200": { $ref: "#/components/responses/PreviewImage" }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
  /web/items/{itemId}/proxy:
    get:
      tags: [web]
      summary: As GET /v1/items/{itemId}/proxy (MP4, ranges), with the gallery session
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/PreviewVersion"
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { description: The proxy, video/mp4 }
        "206": { description: A range of it }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
  /web/items/{itemId}/full:
    get:
      tags: [web]
      summary: "The still at full resolution for 100 % zoom (0.8.1, ADR 0018 \"Full resolution\"): the original, or a JPEG made on demand"
      description: >-
        A JPEG photo or a pair's camera JPEG is answered as the file itself (X-Hoard-Full: original). A HEIF rendering
        (converted) or a lone RAW (raw: its full-size embedded JPEG, else a LibRaw decode) is made on demand in the
        preview queue's full-resolution lane and cached (bounded by --full-cache-mb); 202 with Retry-After while it is
        made.
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: "The image (image/jpeg for a made one); header X-Hoard-Full: original | converted | raw"
        "206": { description: A range of it }
        "202": { $ref: "#/components/responses/PreviewPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PreviewNotFound" }
        "503": { description: "The NAS file is offline or changed (Retry-After), or previews are off" }
  /web/items/{itemId}/edits/{versionId}:
    get:
      tags: [web]
      summary: "As GET /v1/items/{itemId}/edits/{versionId} (0.9.0): the gallery's \"Download edited JPEG\" (download=1: an attachment named \"<stem> (<label>).jpg\")"
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/VersionId"
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200": { description: The stored upload }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /web/items/{itemId}/edits/{versionId}/{name}:
    get:
      tags: [web]
      summary: "As /edits/{versionId}: the name ends the URL; it is ignored"
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/VersionId"
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200": { description: The stored upload }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /web/items/{itemId}/files/{fingerprint}:
    get:
      tags: [web]
      summary: One member file of the item (inline, or an attachment with download=1), with ranges
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: fingerprint
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Fingerprint" }
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { description: "The file; Content-Type by extension, Content-Disposition with its name (filename and filename*=UTF-8'')" }
        "206": { description: A range of it }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The NAS file is offline or changed since it was indexed (Retry-After) }
  /web/items/{itemId}/files/{fingerprint}/{name}:
    get:
      tags: [web]
      summary: "As /files/{fingerprint} (0.8.1): the file's name ends the URL so a browser naming a download by its URL keeps it; the name is ignored"
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: fingerprint
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Fingerprint" }
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
        - $ref: "#/components/parameters/Range"
      responses:
        "200": { description: "The file; Content-Type by extension, Content-Disposition with its name" }
        "206": { description: A range of it }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The NAS file is offline or changed since it was indexed (Retry-After) }
  /web/culling:
    post:
      tags: [web]
      summary: As POST /v1/culling, written by the session's writer id (web:<16 hex>)
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/WebCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/CullChange" }
      responses:
        "200":
          description: As POST /v1/culling
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CullResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /web/downloads:
    post:
      tags: [web]
      summary: A zip download link for items (valid 10 minutes, this session only)
      security: [{ webSession: [] }]
      parameters:
        - $ref: "#/components/parameters/WebCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, examples: ["/web/downloads/3f2a…/Snow-3%20photos.zip"] }
                  name: { type: string, examples: ["Snow-3 photos.zip", "DSC01000.zip", "2024-05-03–2024-05-10-12 photos.zip"] }
                  items: { type: integer }
                  files: { type: integer }
                  bytes: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /web/downloads/{token}:
    get:
      tags: [web]
      summary: "The zip: every file of every item, stored (no compression), streamed; unreadable files listed in missing.txt"
      security: [{ webSession: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: application/zip }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /web/downloads/{token}/{name}:
    get:
      tags: [web]
      summary: "As /web/downloads/{token} (0.8.1): the zip's name ends the URL; the name is ignored"
      security: [{ webSession: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: application/zip }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/backup/roots:
    get:
      tags: [backup]
      summary: "Every phone backup root of every physical device, stopped ones included (hoard-server 0.12.0, ADR 0024)"
      responses:
        "200":
          description: The roots
          content:
            application/json:
              schema:
                type: object
                required: [roots]
                properties:
                  roots: { type: array, items: { $ref: "#/components/schemas/BackupRoot" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [backup]
      summary: "Start mirroring a folder of the caller's phone (0.12.0, ADR 0024)"
      description: >-
        `201` with the root; `200` when it exists (a stopped or paused root is resumed; `types`, when sent, replace
        its types). A path inside a root of this phone that is not stopped: `409 conflict`, reason `covered`; a path
        containing roots absorbs them (`details.absorbed`). The phone's folder under the backup root is made with its
        first root. Paths: relative, '/'-separated, NFC, at most 1024 bytes, segments at most 255 bytes; refused when
        absolute, with "." or ".." segments, a segment starting with ".", a backslash, NUL or control character
        ("a//b" is "a/b"), or, on the primary volume, a first segment "SD card <UUID>" (any case; the tree's SD card
        folders).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volume, path]
              properties:
                volume: { type: string, description: "`primary` or `^[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}$|^[0-9a-f-]{36}$` (stored upper-case)" }
                path: { type: string, description: "Relative to the volume; \"\" = the whole volume" }
                types: { $ref: "#/components/schemas/BackupTypes", description: "Default [image, video]" }
      responses:
        "200":
          description: The existing root (resumed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRoot" }
        "201":
          description: A new root
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRoot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`conflict`, `details.reason` = `covered` (with `details.rootId`): the folder is inside another root of this phone"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: "`storage_not_configured`: no backup folder chosen on the server"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/backup/roots/{rootId}:
    parameters:
      - name: rootId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    patch:
      tags: [backup]
      summary: "Pause or resume a root of this phone, or change its types (0.12.0)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paused: { type: boolean }
                types: { $ref: "#/components/schemas/BackupTypes" }
      responses:
        "200":
          description: The root
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRoot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`not_found`: unknown, or a root of another physical device (never 403)" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [backup]
      summary: "Stop a root (0.12.0): no new entries; the mirror, its files and its items stay"
      description: Deleting backed-up content is the admin page's alone; no device key can.
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: stopped }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`not_found`: unknown, or a root of another physical device" }
  /v1/backup/report:
    post:
      tags: [backup]
      summary: "What the phone has in one root, in batches (0.12.0, ADR 0024)"
      description: >-
        Idempotent; the order of batches does not matter. Paths are relative to the volume and inside the root.
        Entries are applied first, then removals: a new path whose content was deleted at another path of the phone is
        a move; a removal whose content is at another current path is `moved`. A file deleted from the phone is kept
        (forever); a file rewritten in place keeps its earlier content as a previous version. Report a removal only when
        the listing of the root was complete; the server never infers a deletion from silence. A bad entry or
        removal never fails the batch (0.12.0): it is answered on its own with `state: refused` and a `reason`, and the
        others are applied. Only a malformed request as a whole is `422` (bad JSON, more than 1000 entries or removals).
        Phone backups also take PNG, WebP and GIF stills (a screenshot is a photo of its own shot); the NAS library
        keeps indexing only what it did.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootId]
              properties:
                rootId: { $ref: "#/components/schemas/Uuid" }
                entries:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [path, fingerprint, size, modifiedAt]
                    properties:
                      path: { type: string, description: "A photo, video or sidecar (ADR 0014 extensions, and `png`, `webp`, `gif`)" }
                      fingerprint: { $ref: "#/components/schemas/Fingerprint" }
                      size: { type: integer, minimum: 1 }
                      modifiedAt: { type: integer, format: int64, description: "The phone's mtime, Unix ms" }
                      sha256: { $ref: "#/components/schemas/Sha256", description: "Optional; send it when known" }
                removed:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [path, reason]
                    properties:
                      path: { type: string }
                      reason: { type: string, enum: [deleted, moved, freed], description: "`freed` only after a free-up deletion the owner confirmed" }
      responses:
        "200":
          description: Per entry and per removal
          content:
            application/json:
              schema:
                type: object
                required: [results, removed]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [index, path, state, verified]
                      properties:
                        index: { type: integer }
                        path: { type: string }
                        state:
                          type: string
                          enum: [stored, nas, missing, in_progress, differs, refused]
                          description: >-
                            `refused`: this entry was not taken (see `reason`, `detail`); the rest of the batch was applied.
                            `stored`: the bytes are in the store (and linked); `nas`: an indexed NAS file has them;
                            `missing`: upload it; `in_progress`: another device's upload of it is running (`retryAfter`);
                            `differs`: the server has this fingerprint with another SHA-256: upload it, both are kept.
                        itemId: { $ref: "#/components/schemas/Uuid", description: "The live item holding the file, once made" }
                        verified: { type: string, enum: ["yes", pending, "no"] }
                        retryAfter: { type: integer }
                        reason: { $ref: "#/components/schemas/BackupRefusal" }
                        detail: { type: string, description: "With `refused`: why, for people" }
                  removed:
                    type: array
                    items:
                      type: object
                      required: [index, path, state]
                      properties:
                        index: { type: integer }
                        path: { type: string }
                        state: { type: string, enum: [kept, moved, unknown, refused] }
                        reason: { $ref: "#/components/schemas/BackupRefusal" }
                        detail: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`not_found`: unknown root, or a root of another physical device" }
        "409":
          description: "`conflict`, `details.reason` = `stopped`: the root is stopped"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: "`storage_not_configured`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/backup/verify:
    post:
      tags: [backup]
      summary: "Is the server's copy of each file byte-identical to the phone's, proven now? (0.12.0, free up)"
      description: >-
        The server compares the phone's sha256 with its own re-hash of its copy (not the database's belief), kept for
        30 days per content; re-hashes run in a bounded background queue, `pending` until done. An entry whose only copy
        is on the NAS is first copied into the store (server-side, checked by SHA-256) while the server setting "Keep a
        copy of NAS files a phone no longer has" is on (the default); with it off, the NAS file is hashed where it is,
        only while its size and mtime still match the index. Every result carries `namedByRecord`: a live Reveal photo
        record names the entry's fingerprint, or a live version record names it as `data.photoFingerprint`. A root of
        another physical device is `404` with `details.index`. 0.12.1: with `maxAge`, a stored re-hash older than it is
        queued again and answered `pending` (with `retryAfter`) exactly as when none exists, and `verifiedAt` is the new
        re-hash's once it ran (a blob's, and a NAS entry's `verified_sha256` / `nas_files.sha256`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                maxAge:
                  type: integer
                  format: int64
                  description: >-
                    0.12.1, optional, milliseconds: the oldest stored re-hash that may answer. Clamped to 1 hour
                    (3600000) to 30 days (2592000000), so a client cannot make the server hash nonstop; absent means
                    30 days. An entry's own `maxAge` wins.
                entries:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [rootId, path, sha256, size]
                    properties:
                      rootId: { $ref: "#/components/schemas/Uuid" }
                      path: { type: string }
                      sha256: { $ref: "#/components/schemas/Sha256" }
                      size: { type: integer, minimum: 1 }
                      maxAge: { type: integer, format: int64, description: "0.12.1, optional: this entry's `maxAge` (see the request's); wins over it" }
      responses:
        "200":
          description: Per entry
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [index, verified, namedByRecord]
                      properties:
                        index: { type: integer }
                        state: { type: string, enum: [refused], description: "Present when this entry was refused on its own (`reason`, `detail`); `verified` is then `no`" }
                        detail: { type: string }
                        verified: { type: string, enum: ["yes", pending, "no"] }
                        verifiedAt: { type: integer, format: int64 }
                        retryAfter: { type: integer }
                        reason:
                          oneOf:
                            - { type: string, enum: [differs, missing, changed_on_nas, unavailable, not_found] }
                            - { $ref: "#/components/schemas/BackupRefusal" }
                        namedByRecord: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`not_found`: a root that is unknown or another physical device's (`details.index`)" }
        "422": { $ref: "#/components/responses/Unprocessable" }
components:
  securitySchemes:
    deviceKey:
      type: http
      scheme: bearer
      description: "Device key from POST /v1/pair: rvk1_<keyId>_<secret>."
    webSession:
      type: apiKey
      in: cookie
      name: hoard_web
      description: "Web gallery session (POST /web/session with the admin password; ADR 0018). LAN/Tailscale only."
  parameters:
    WebCsrf:
      name: X-Hoard-Web
      in: header
      required: true
      description: "1 on every state-changing /web/ call (a cross-site form cannot set it)."
      schema: { type: string, enum: ["1"] }
    Range:
      name: Range
      in: header
      schema: { type: string, examples: ["bytes=0-1048575"] }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    PreviewSize:
      name: size
      in: query
      schema: { type: string, enum: [thumb, screen], default: thumb }
    PreviewFormat:
      name: format
      in: query
      description: JPEG (default, decodes everywhere) or WebP (about a third smaller at the same SSIM; ADR 0015 "Formats").
      schema: { type: string, enum: [jpeg, webp], default: jpeg }
    VersionId:
      name: versionId
      in: path
      required: true
      description: Reveal's version id (ADR 0013 "Records"), lower-case UUID
      schema: { $ref: "#/components/schemas/Uuid" }
    PreviewEdit:
      name: edit
      in: query
      description: "(0.9.0, ADR 0020) Reveal's edited preview instead of the original: a version id, or primary"
      schema: { type: string }
    PreviewVersion:
      name: v
      in: query
      description: The preview's key (X-Hoard-Preview-Version, or `v` from POST /v1/items/previews); makes the answer immutable when it is the current one.
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
  responses:
    Bytes:
      description: The bytes (application/octet-stream; ETag, Accept-Ranges)
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    PartialBytes:
      description: The requested range
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    BadRequest:
      description: "`invalid_request` or `invalid_json`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthorized`: missing, malformed, unknown or revoked key"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Missing X-Hoard-Web header or a cross-origin request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: "`too_large`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: "`unsupported_media_type`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: "`invalid_request` or `checksum_mismatch`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreviewImage:
      description: The JPEG (image/jpeg) or WebP (image/webp)
      headers:
        ETag: { schema: { type: string } }
        X-Hoard-Preview-Version: { schema: { type: string }, description: The content key (source + recipe + PREVIEW_VERSION) }
        X-Hoard-Preview: { schema: { type: string, enum: [ready, stale] } }
      content:
        image/jpeg:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
    PreviewPending:
      description: Not made yet; queued ahead of the backlog. Ask again after Retry-After seconds.
      headers:
        Retry-After: { schema: { type: integer } }
        X-Hoard-Preview: { schema: { type: string, const: pending } }
      content:
        application/json:
          schema:
            type: object
            required: [status, retryAfter]
            properties:
              status: { type: string, const: pending }
              retryAfter: { type: integer }
    PreviewNotFound:
      description: >-
        `not_found` (no such live item) or `preview_unavailable` with `details.reason`: `not_applicable` (a poster of a
        still, a proxy of a photo), `unsupported` (no decoder for the file), `failed` (generation failed three times),
        `no_tools`, `no_edit` (0.9.0: the item has no such edit).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`"
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    BackupRefusal:
      type: string
      enum: [unsupported_type, invalid_path, outside_root, reserved_prefix, invalid_fingerprint, invalid_size, invalid_modified_at, invalid_sha256, invalid_reason]
      description: >-
        Why one report or verify entry was refused on its own (0.12.0): `unsupported_type` (not a photo, video or
        sidecar the backup takes), `invalid_path`, `outside_root`, `reserved_prefix` (`SD card <UUID>` on the primary
        volume), `invalid_*` (a malformed field), `invalid_reason` (a removal's reason).
    Uuid:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Fingerprint:
      type: string
      pattern: "^v1:[0-9a-f]{64}$"
      description: "v1: + SHA-256 over size (8 bytes BE), first 1 MiB, last 1 MiB (whole file when <= 2 MiB). Reveal ADR 0006."
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Kind:
      type: string
      enum: [photo, version, preset, setting]
    Record:
      type: object
      required: [kind, id, rev, deleted, modifiedAt, deviceId, data]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        id: { type: string }
        rev: { type: integer }
        deleted: { type: boolean }
        modifiedAt: { type: integer, description: Unix ms, device clock }
        deviceId: { $ref: "#/components/schemas/Uuid" }
        copyOf:
          description: Version only; the version this one is the conflict copy of.
          $ref: "#/components/schemas/Uuid"
        data:
          oneOf:
            - type: object
            - type: "null"
    Change:
      type: object
      required: [kind, id, baseRev, modifiedAt]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        id:
          type: string
          description: A UUID for photo/version/preset; `[a-z0-9][a-z0-9._-]{0,63}` for a setting.
        baseRev: { type: integer, minimum: 0, description: rev of the state edited; 0 for a new record }
        modifiedAt: { type: integer, minimum: 1 }
        deleted: { type: boolean, default: false }
        data:
          type: object
          description: |
            Required unless deleted; at most 2 MiB. A photo needs `fingerprint`; a version needs `photoId`
            (and carries `position`, `name`, `recipe` (Reveal ADR 0003), `history`, `cursor`).
    Result:
      type: object
      required: [kind, id, status, rev]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        id: { type: string }
        status: { type: string, enum: [applied, conflict] }
        rev: { type: integer, description: The record's current rev after this change }
        winner: { type: string, enum: [incoming, server] }
        copyId: { $ref: "#/components/schemas/Uuid" }
    BackupTypes:
      type: array
      description: "The kinds of files the phone backs up from a root (ADR 0024): image, video, raw, sidecar. A file of another kind is not covered."
      items: { type: string, enum: [image, video, raw, sidecar] }
    BackupRoot:
      type: object
      required: [id, physicalDeviceId, deviceName, mine, folder, volume, path, createdBy, app, createdAt, types, paused, stopped, active, lastReportAt, stats]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        physicalDeviceId: { $ref: "#/components/schemas/Uuid" }
        deviceName: { type: string }
        mine: { type: boolean, description: "The root belongs to the caller's physical device" }
        folder: { type: string, description: "The phone's folder under the backup root" }
        volume: { type: string, description: "`primary` or the volume UUID, upper-case" }
        path: { type: string, description: "Relative to the volume, '/'-separated; \"\" = the whole volume" }
        createdBy: { $ref: "#/components/schemas/Uuid" }
        app: { type: [string, "null"] }
        createdAt: { type: integer, format: int64 }
        types: { $ref: "#/components/schemas/BackupTypes" }
        paused: { type: boolean }
        stopped: { type: boolean }
        active: { type: boolean, description: "Not paused, not stopped, and a live device of that phone reported (or made the root) in the last 7 days" }
        lastReportAt: { type: [integer, "null"], format: int64 }
        stats:
          type: object
          description: "Every path the root holds (current, deleted from the phone, freed)"
          properties:
            files: { type: integer }
            bytes: { type: integer, format: int64 }
            stored: { type: integer }
            nas: { type: integer }
            waiting: { type: integer }
            removedFromDevice: { type: integer }
            freed: { type: integer }
            verified: { type: integer }
        details:
          type: object
          description: "POST only: `absorbed`, the roots inside the new one whose entries moved to it"
          properties:
            absorbed: { type: array, items: { $ref: "#/components/schemas/Uuid" } }
    UploadState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [exists, created, resume, in_progress] }
        retryAfter: { type: integer, description: "in_progress (0.12.0): seconds before asking again" }
        uploadId: { $ref: "#/components/schemas/Uuid" }
        offset: { type: integer }
        chunkSize: { type: integer }
        expiresAt: { type: integer, description: Unix ms }
    NasFile:
      type: object
      required: [fingerprint, folderId, folderName, path, size, modifiedAt, removed]
      properties:
        fingerprint:
          oneOf:
            - $ref: "#/components/schemas/Fingerprint"
            - type: "null"
        folderId: { $ref: "#/components/schemas/Uuid" }
        folderName: { type: string }
        path: { type: string, description: "Relative to the folder, /-separated" }
        size: { type: integer }
        modifiedAt: { type: integer }
        removed: { type: boolean }
        trashed:
          type: boolean
          description: "0.11.0 (ADR 0023): with `removed: true`, the file moved to a trash (absent otherwise)"
    Counts:
      type: object
      properties:
        devices: { type: integer }
        photos: { type: integer }
        versions: { type: integer }
        blobs: { type: integer }
        nasFiles: { type: integer, description: "Live NAS photos; files in a trash are not counted (0.11.0)" }
        pendingUploads: { type: integer }
        items: { type: integer, description: "Live items (hoard-server 0.5.0)" }
    ServerInfo:
      type: object
      required: [serverId, serverName, version, api, deviceId, limits, storageConfigured]
      properties:
        serverId: { $ref: "#/components/schemas/Uuid" }
        serverName: { type: string }
        version: { type: string }
        api: { type: integer, const: 1 }
        deviceId: { $ref: "#/components/schemas/Uuid" }
        storageConfigured: { type: boolean }
        features:
          type: array
          description: >-
            Optional parts of the API this server has (hoard-server 0.5.0; absent before). `items` = ADR 0014,
            `previews` = ADR 0015 (0.6.0), `culling` = ADR 0016 and `device-identity` = ADR 0017 (0.7.0), `edits` =
            ADR 0020 (0.9.0, with previews), `items-by-path` = ADR 0014 (0.10.0), `trash` = ADR 0023 (0.11.0), `backup`
            = ADR 0024 (0.12.0). Clients ignore names they do not know.
          items: { type: string, enum: [items, items-by-path, previews, culling, device-identity, edits, trash, backup] }
        backup:
          type: object
          description: The phone backup's limits (ADR 0024, 0.12.0; with the backup feature).
          properties:
            maxRoots: { type: integer, description: "Roots per phone that are not stopped (64)" }
            maxReportEntries: { type: integer, description: "Entries, and removals, per report (1000)" }
            maxVerify: { type: integer, description: "Entries per verify (500)" }
            maxPath: { type: integer, description: "Bytes of a phone path (1024)" }
        edits:
          type: object
          description: Present with the edits feature (ADR 0020).
          properties:
            maxBytes: { type: integer }
            maxEdge: { type: integer }
            minEdge: { type: integer }
            formats: { type: array, items: { type: string, enum: [jpeg, webp] } }
            maxPerItem: { type: integer }
            maxLabel: { type: integer }
            maxDigest: { type: integer }
        previews:
          type: object
          description: Present when the server makes previews (ADR 0015). Not in limits, which is reveal-sync's.
          properties:
            version: { type: integer, description: PREVIEW_VERSION }
            thumbEdge: { type: integer }
            screenEdge: { type: integer }
            proxyShortEdge: { type: integer }
            maxWarm: { type: integer }
            requestsPerSecond: { type: integer }
            requestBurst: { type: integer }
        limits:
          type: object
          properties:
            maxJsonBody: { type: integer }
            maxRecordData: { type: integer }
            maxPushChanges: { type: integer }
            maxPullLimit: { type: integer }
            maxLookup: { type: integer }
            chunkSize: { type: integer }
            maxBlobSize: { type: integer }
            maxUploadsPerDevice: { type: integer }
            requestsPerSecond: { type: integer }
            requestBurst: { type: integer }
    PreviewState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, pending, unavailable] }
        v: { type: string, description: "ready: the key for ?v=" }
        stale: { type: boolean, description: "ready, but an older preview; a new one is queued" }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer, description: "the JPEG's (the MP4's for a proxy)" }
        webpBytes: { type: integer, description: "thumb and screen: the WebP's" }
        reason: { type: string, enum: [not_applicable, unsupported, failed, no_tools, no_edit] }
    Role:
      type: string
      enum: [raw, rendered, video, sidecar]
    Capture:
      type: object
      required: [source]
      description: ADR 0014 "Capture time".
      properties:
        local: { type: string, description: "Wall clock, 2006-01-02T15:04:05[.000]" }
        offset: { type: string, description: "UTC offset of local, +09:00" }
        utc: { type: integer, description: "The instant, Unix ms, when known" }
        source: { type: string, enum: [exif, exif-gps, quicktime, mtime, upload] }
    Gps:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
        alt: { type: number }
    VideoInfo:
      type: object
      properties:
        durationMs: { type: integer }
        container: { type: string }
        codec: { type: string }
        profile: { type: string }
        width: { type: integer }
        height: { type: integer }
        rotation: { type: integer, enum: [0, 90, 180, 270], description: "Clockwise, to apply for display" }
        fps: { type: number }
        bitDepth: { type: integer }
        hdr: { type: string, enum: [pq, hlg, dolby-vision] }
        colorSpace: { type: string }
        audio: { type: string }
    ItemLocation:
      type: object
      required: [source]
      description: >-
        Clients ignore sources they do not know. A `mirror` location (0.12.0, ADR 0024) always sits next to the `backup`
        or `nas` location that holds the file's bytes.
      properties:
        source: { type: string, enum: [nas, backup, mirror] }
        folderId: { $ref: "#/components/schemas/Uuid" }
        folderName: { type: string }
        physicalDeviceId: { $ref: "#/components/schemas/Uuid", description: "mirror: the phone" }
        deviceName: { type: string, description: "mirror: the phone's name" }
        rootId: { $ref: "#/components/schemas/Uuid", description: "mirror: the backup root (GET /v1/items?folder=<rootId>)" }
        volume: { type: string, description: "mirror: `primary` or the volume UUID (upper-case)" }
        onDevice: { type: boolean, description: "mirror: false once the phone no longer has the file" }
        gone:
          type: string
          description: "mirror, with onDevice false: `freed` (Hoard's free up deleted it after verification) or `deleted` (deleted, trashed, or rewritten in place). Unknown values mean `deleted`."
        path: { type: string, description: "nas: relative to the folder, /-separated (in a trash: the original path); mirror: relative to the phone's volume" }
        trash:
          type: string
          description: "nas, with include=trash only (0.11.0, ADR 0023): the file is in a trash, at this path relative to the folder (`<P>/.hoard-trash/<day>/<R>`)"
        modifiedAt: { type: integer, description: "nas: the file's mtime; mirror: the phone's; Unix ms" }
        sha256: { type: string, description: "backup: the uploaded blob" }
    ItemFile:
      type: object
      required: [fingerprint, role, size, locations]
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        role: { $ref: "#/components/schemas/Role" }
        name: { type: string }
        format: { type: string, description: "Content format: jpeg, heif, tiff, cr3, raf, mp4, mov, xmp, …" }
        size: { type: integer }
        locations:
          type: array
          items: { $ref: "#/components/schemas/ItemLocation" }
    Item:
      type: object
      required: [id, rev, deleted, createdAt, updatedAt]
      description: |
        One shot (ADR 0014). A tombstone (`deleted: true`) carries only `id`, `rev`, `deleted`, the timestamps and
        `replacedBy` when another item took its main file over. Unknown fields are ignored by clients. A trashed item
        (0.11.0, ADR 0023: every file in a trash) is a tombstone without `replacedBy` to clients that did not ask
        for the trash, and is served whole with `trashed` to those that did.
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        rev: { type: integer }
        deleted: { type: boolean }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        replacedBy: { $ref: "#/components/schemas/Uuid" }
        trashed:
          type: object
          required: [since]
          description: "With include=trash only (0.11.0, ADR 0023): the item is in a trash"
          properties:
            since: { type: integer, description: "When the server first saw it trashed, Unix ms" }
        kind: { type: string, enum: [photo, pair, video, motion] }
        mainFingerprint: { $ref: "#/components/schemas/Fingerprint" }
        sortTime: { type: integer, description: "capture.utc, else the wall clock read as UTC, else 0" }
        capture: { $ref: "#/components/schemas/Capture" }
        make: { type: string }
        model: { type: string }
        lensMake: { type: string }
        lens: { type: string }
        gps: { $ref: "#/components/schemas/Gps" }
        width: { type: integer }
        height: { type: integer }
        orientation: { type: integer, minimum: 1, maximum: 8, description: "EXIF orientation of the still" }
        video: { $ref: "#/components/schemas/VideoInfo" }
        motion:
          type: object
          required: [source, fingerprint]
          properties:
            source: { type: string, enum: [file, embedded] }
            fingerprint: { $ref: "#/components/schemas/Fingerprint" }
            format: { type: string, enum: [google, microvideo, samsung] }
            offset: { type: integer }
            length: { type: integer }
            presentationUs: { type: integer }
        files:
          type: array
          items: { $ref: "#/components/schemas/ItemFile" }
        edits:
          type: array
          description: "Reveal's edited previews (0.9.0, ADR 0020), the primary first; absent when none"
          items: { $ref: "#/components/schemas/Edit" }
    Edit:
      type: object
      required: [versionId, label, recipeDigest, editedAt, primary, isVirtualCopy, deviceId, format, width, height, bytes, updatedAt]
      properties:
        versionId: { $ref: "#/components/schemas/Uuid" }
        label: { type: string }
        recipeDigest: { type: string }
        editedAt: { type: integer, format: int64 }
        primary: { type: boolean }
        isVirtualCopy: { type: boolean }
        deviceId: { $ref: "#/components/schemas/Uuid", description: the device that uploaded the image }
        format: { type: string, enum: [jpeg, webp] }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer }
        updatedAt: { type: integer, format: int64 }
    EditWriteResult:
      type: object
      required: [status, itemId, rev, edit]
      properties:
        status: { type: string, enum: [created, replaced, updated, unchanged] }
        itemId: { $ref: "#/components/schemas/Uuid" }
        rev: { type: integer, description: "the item's revision after the write" }
        edit: { $ref: "#/components/schemas/Edit" }
    CullValue:
      description: "rating: integer 0..5; flag: pick | reject | none; label: a string of at most 64 characters (\"\" = none)"
      oneOf:
        - { type: integer, minimum: 0, maximum: 5 }
        - { type: string, maxLength: 64 }
    CullChange:
      type: object
      description: Exactly one of itemId and fingerprint.
      required: [field, value, baseRev, modifiedAt]
      properties:
        itemId: { $ref: "#/components/schemas/Uuid" }
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        field: { type: string, enum: [rating, flag, label] }
        value: { $ref: "#/components/schemas/CullValue" }
        baseRev: { type: integer, minimum: 0, description: "The field's rev the device last saw; 0 = never seen." }
        modifiedAt: { type: integer, description: "When the user made the change, Unix ms, the device's clock." }
    CullResult:
      type: object
      description: |
        The outcome of one change. `applied` / `unchanged` / `conflict` carry `itemId` and `rev`; `invalid` carries
        `code` and `message` and echoes the `itemId` or `fingerprint` and `field` it was sent with (no `rev`).
      required: [index, field, status]
      properties:
        index: { type: integer, description: "The change's position in `changes`." }
        itemId: { $ref: "#/components/schemas/Uuid" }
        fingerprint: { type: string, description: "Only on `invalid`, as sent." }
        field: { type: string, description: "rating, flag or label (on `invalid`: as sent)" }
        status: { type: string, enum: [applied, unchanged, conflict, invalid] }
        winner: { type: string, enum: [incoming, server] }
        rev: { type: integer }
        clipped: { type: boolean }
        code:
          type: string
          enum: [invalid_target, invalid_field, invalid_value, label_too_long, invalid_base_rev, invalid_modified_at, unknown_item]
        message: { type: string, description: "English, for logs." }
    CullField:
      type: object
      required: [value, rev, modifiedAt, deviceId]
      properties:
        value: { $ref: "#/components/schemas/CullValue" }
        rev: { type: integer }
        modifiedAt: { type: integer }
        deviceId: { type: string, description: "A device id, or `nas` for a value imported from a NAS sidecar." }
    Culling:
      type: object
      description: |
        An item's culling record; fields never written are absent. A client maps it to its photos by any of
        `fingerprints` (else by the id derived from its main fingerprint when `fingerprints` is empty) and follows
        `replacedBy` (ADR 0016 "Mapping a record").
      required: [itemId, rev, fingerprints]
      properties:
        itemId: { $ref: "#/components/schemas/Uuid" }
        rev: { type: integer, description: "Its newest change in the feed: a field write, or its item's members changing." }
        fingerprints:
          type: array
          items: { $ref: "#/components/schemas/Fingerprint" }
          description: The item's member files, main first; empty when the server has no live item with this id.
        replacedBy: { $ref: "#/components/schemas/Uuid", description: "The live item that took a replaced item over." }
        rating: { $ref: "#/components/schemas/CullField" }
        flag: { $ref: "#/components/schemas/CullField" }
        label: { $ref: "#/components/schemas/CullField" }
    AppName:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 32
      examples: [hoard, reveal, reveal-debug, reveal-bench, hoard-debug]
      description: |
        Which app this device is, with its build variant when it is not the release (ADR 0017; 0.7.0). Variants are
        distinct apps of one physical device.
    DeviceEntry:
      type: object
      required: [id, name, app, platform, manufacturer, model]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        app: { type: [string, "null"] }
        platform: { type: string }
        manufacturer: { type: [string, "null"] }
        model: { type: [string, "null"] }
    Candidate:
      type: object
      required: [physicalDeviceId, name, match, devices]
      properties:
        physicalDeviceId: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        match: { type: string, enum: [model, other] }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceEntry" }
    DeviceView:
      type: object
      required: [deviceId, name, platform, app, manufacturer, model, features, physicalDevice, candidates]
      properties:
        deviceId: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        platform: { type: string }
        app: { type: [string, "null"] }
        manufacturer: { type: [string, "null"] }
        model: { type: [string, "null"] }
        features:
          type: array
          items: { type: string }
          description: Capabilities the device declared or was seen using (ADR 0016), e.g. `culling`, `freed-adopt`.
        physicalDevice:
          type: object
          required: [id, name, devices]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            name: { type: string }
            devices:
              type: array
              description: "The live (not revoked) devices of the physical device; revoked ones are never listed. `lastSeenAt` is hoard-server 0.10.0 (ADR 0017 \"Liveness\")"
              items:
                allOf:
                  - $ref: "#/components/schemas/DeviceEntry"
                  - type: object
                    required: [lastSeenAt]
                    properties:
                      lastSeenAt: { type: [integer, "null"], format: int64, description: "Unix ms; null: never seen" }
                      features:
                        type: array
                        items: { type: string }
                        description: "hoard-server 0.12.0: what that device declared (`culling`, `freed-adopt`), sorted; `[]` for none"
            backup:
              type: object
              description: >-
                hoard-server 0.12.0 (ADR 0024), with the backup feature: the folders this phone backs up (`roots: []`
                when none), for Reveal's delegation. A Reveal folder inside an `active` root, a file of a kind in its
                `types`, is covered.
              required: [roots]
              properties:
                roots:
                  type: array
                  items:
                    type: object
                    required: [id, volume, path, app, active, since, types]
                    properties:
                      id: { $ref: "#/components/schemas/Uuid" }
                      volume: { type: string }
                      path: { type: string }
                      app: { type: [string, "null"], description: "The app of the device that made the root" }
                      active: { type: boolean, description: "Not paused or stopped, and a live device of this phone reported in the last 7 days" }
                      since: { type: integer, format: int64, description: "When the root was made, Unix ms" }
                      types: { $ref: "#/components/schemas/BackupTypes" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }
    LibraryRow:
      type: object
      description: One item in the web gallery's index (ADR 0018); absent fields are empty.
      required: [id, t, k, n]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        t: { type: integer, format: int64, description: sortTime, ms }
        l: { type: integer, format: int64, description: "The camera's wall clock read as UTC, when it differs from t" }
        k: { type: string, enum: [photo, pair, video, motion] }
        w: { type: integer, description: upright width }
        h: { type: integer, description: upright height }
        "n": { type: string, description: "main file's name" }
        fo: { type: string, description: NAS folder id (absent = uploaded by a device) }
        d: { type: string, description: directory in the folder }
        cam: { type: string, description: make and model as one name }
        lens: { type: string }
        raw: { type: boolean, description: the main file is a RAW }
        dur: { type: integer, description: video duration, ms }
        r: { type: integer, minimum: 1, maximum: 5 }
        x: { type: string, enum: [pick, reject] }
        lb: { type: string }
        e: { type: boolean, description: edited in Reveal }
        v: { type: string, description: "image preview key on disk (?v= for immutable URLs)" }
        cr: { type: string, description: "culling field revisions rating.flag.label" }
        size: { type: integer, format: int64, description: bytes of all files }
        ed:
          type: array
          description: "(0.9.0) Reveal's edits, the primary first: id (version), l label, p primary, c virtual copy, v preview key, w/h size"
          items:
            type: object
            required: [id]
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              l: { type: string }
              p: { type: boolean }
              c: { type: boolean }
              v: { type: string }
              w: { type: integer }
              h: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_cursor, invalid_json, unauthorized, invalid_pairing_token, forbidden, not_found,
                method_not_allowed, offset_mismatch, upload_busy, conflict, too_large, unsupported_media_type,
                invalid_change, checksum_mismatch, rate_limited, internal, storage_not_configured, unavailable]
            message: { type: string }
            details: { type: object }
