# Example: hoard-server with its database in ./data, a backup folder and a read-only NAS share.
# Everything the setup page can offer is mounted under /mnt; the container sees nothing else.
#
#   mkdir -p data backup && sudo chown 65532:65532 data backup
#   docker compose up -d
#   docker compose logs hoard-server | grep setupCode    # first run: the one-time setup code
#   open http://<this machine>:3071/admin/ from your network
#
# Upgrading from reveal-sync: keep the same ./data and backup folder, change the image (README, "Upgrading from
# reveal-sync"). The database and blob folder keep their reveal-sync names on disk.
services:
  hoard-server:
    image: ghcr.io/henriquefps/hoard-server:latest
    # To build from this folder instead of pulling the published image:
    # build: .
    container_name: hoard-server
    ports:
      # BIND_IP limits the port to one interface (e.g. the Tailscale address).
      - "${BIND_IP:-0.0.0.0}:${PORT:-3071}:3071"
    volumes:
      - ./data:/data                                   # database and settings (keep it backed up)
      - ${BACKUP_DIR:-./backup}:/mnt/backup            # uploaded originals and smart previews
      - ${NAS_DIR:-/srv/photos}:/mnt/nas:ro            # NAS shoots, indexed read-only
    environment:
      - LOG_FORMAT=json
      - NAS_INTERVAL=30m
      # Gallery previews (ADR 0015): made in the background at low priority. PREVIEW_BACKLOG=image makes video
      # proxies only when a video is played; none makes everything on demand.
      - PREVIEW_WORKERS=2
      - PROXY_WORKERS=1
      - PREVIEW_THREADS=2
      - PREVIEW_BACKLOG=image,proxy
    # The server runs as uid 65532; resource limits keep it polite on a shared machine (a 4K HEVC proxy is the
    # largest job: give it at least 1.5 GiB).
    cpus: "2"
    mem_limit: 1536m
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  # Optional: reach the server from anywhere over HTTPS through a Cloudflare Tunnel. Devices sync through
  # it with their keys; the setup page stays LAN-only unless you allow it on the Status page.
  # CLOUDFLARE_TUNNEL_TOKEN comes from your secret vault at run time, never from a file in the repository.
  # Start it with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - hoard-server
