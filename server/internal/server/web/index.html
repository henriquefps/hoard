<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Hoard server</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script type="module" src="assets/app.js"></script>
</head>
<body>
<header class="app-header">
  <img class="logo" src="assets/icon.svg" alt="" aria-hidden="true">
  <h1 class="title" data-t="title">Hoard server</h1>
  <nav class="tabs" id="tabs" hidden></nav>
  <div class="app-header-actions">
    <select id="lang" class="select compact" aria-label="Language">
      <option value="en">English</option>
      <option value="pt-BR">Português</option>
    </select>
    <select id="theme" class="select compact" data-t-aria="theme">
      <option value="system" data-t="themeSystem">System</option>
      <option value="light" data-t="themeLight">Light</option>
      <option value="dark" data-t="themeDark">Dark</option>
    </select>
    <button id="signout" class="icon-button" hidden data-t-aria="signOut" data-icon="sign-out"></button>
  </div>
</header>
<nav class="tabs mobile" id="tabs-mobile" hidden></nav>
<main class="app-card"><div class="app-page" id="page"></div></main>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
