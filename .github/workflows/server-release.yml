name: Server release

# Push a tag like server-v0.6.0 to publish static binaries (linux amd64 + arm64) to a GitHub release and the
# multi-arch image to ghcr.io/henriquefps/hoard-server. The Hoard app keeps its own v* tags.
on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Web gallery build (embedded in the binaries; the image builds it in its own stage)
        run: cd web && bun install --frozen-lockfile && bun run build

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"

      - name: ffmpeg and libvips (same test tools as server.yml)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libvips-tools libheif-plugin-libde265 libheif-plugin-dav1d

      - name: Test
        run: go test -count=1 ./...

      - name: Build archives
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            out=dist/hoard-server_linux_$arch
            mkdir -p $out
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }} -X main.commit=${GITHUB_SHA::7}" \
              -o $out/hoard-server .
            cp README.md docker-compose.yml ../LICENSE $out/
            tar -C dist -czf dist/hoard-server_linux_$arch.tar.gz hoard-server_linux_$arch
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "hoard-server ${{ steps.v.outputs.version }}" \
            --notes "hoard-server ${{ steps.v.outputs.version }}: see server/README.md and docs/adr/0013-server-protocol.md." \
            dist/*.tar.gz dist/checksums.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image (linux/amd64, linux/arm64)
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${{ steps.v.outputs.version }} --build-arg COMMIT=${GITHUB_SHA::7} \
            --label org.opencontainers.image.source=https://github.com/henriquefps/hoard \
            --label org.opencontainers.image.licenses=AGPL-3.0-or-later \
            -t ghcr.io/henriquefps/hoard-server:${{ steps.v.outputs.version }} -t ghcr.io/henriquefps/hoard-server:latest .
