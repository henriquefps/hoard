// Shared by :app and :native (ADR 0019). ML Kit face detection (ADR 0009) ships its native library for
// four ABIs (~33 MB uncompressed in a universal APK). Keep it for the ABIs libhoardimage is built for; on 32-bit and x86 devices face
// detection reports itself unavailable (analysis still runs, without faces). The contour model is
// not used (contour mode is off): `!contours.tfl` in build.gradle's ignoreAssetsPattern.
android {
    packaging {
        jniLibs {
            excludes += ['lib/armeabi-v7a/libface_detector_v2_jni.so', 'lib/x86/libface_detector_v2_jni.so']
        }
    }
}
