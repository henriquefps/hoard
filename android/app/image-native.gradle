// Native image core (dev.hfps.hoard.image): LibRaw + JNI, built from src/main/cpp with CMake.
// Kept apart from build.gradle so plugin/UI work there does not conflict with it. See ADR 0006.
android {
    ndkVersion = "28.2.13676358"
    defaultConfig {
        externalNativeBuild {
            cmake {
                // Phones (arm64) and the emulator on x86 hosts. Other ABIs ship without
                // libhoardimage: RAW files then fall back to their embedded previews.
                abiFilters 'arm64-v8a', 'x86_64'
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++17'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
}

// Opt-in tests on real camera files (never committed): HOARD_ARW_DIR=/path/to/a/shoot.
tasks.withType(Test).configureEach {
    environment 'HOARD_ARW_DIR', System.getenv('HOARD_ARW_DIR') ?: ''
}

// ML Kit face detection (ADR 0009) ships its native library for four ABIs (~33 MB uncompressed in a
// universal APK). Keep it for the ABIs libhoardimage is built for; on 32-bit and x86 devices face
// detection reports itself unavailable (analysis still runs, without faces). The contour model is
// not used (contour mode is off): `!contours.tfl` in build.gradle's ignoreAssetsPattern.
android {
    packaging {
        jniLibs {
            excludes += ['lib/armeabi-v7a/libface_detector_v2_jni.so', 'lib/x86/libface_detector_v2_jni.so']
        }
    }
}
