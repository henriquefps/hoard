apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "dev.hfps.hoard"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.hfps.hoard"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing reads the keystore from the environment, never from the repo. The values live in
    // the skv vault (group "hoard"): `bun run android:release` runs Gradle under `skv run hoard`, which
    // exports HOARD_KEYSTORE (path of a temp copy of the .jks), HOARD_KEYSTORE_PASSWORD, HOARD_KEY_ALIAS
    // and HOARD_KEY_PASSWORD. Without them the release APK is built unsigned (CI, contributors).
    def releaseKeystore = System.getenv('HOARD_KEYSTORE')
    def releaseSigning = releaseKeystore && file(releaseKeystore).exists() &&
        System.getenv('HOARD_KEYSTORE_PASSWORD') && System.getenv('HOARD_KEY_ALIAS')
    signingConfigs {
        if (releaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('HOARD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HOARD_KEY_ALIAS')
                keyPassword System.getenv('HOARD_KEY_PASSWORD') ?: System.getenv('HOARD_KEYSTORE_PASSWORD')
            }
        }
    }
    if (!releaseSigning && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
        logger.warn('Hoard: HOARD_KEYSTORE / HOARD_KEYSTORE_PASSWORD / HOARD_KEY_ALIAS not set: the release APK will be UNSIGNED. ' +
            'Use `bun run android:release` (skv run hoard) for a signed build.')
    }
    buildTypes {
        release {
            if (releaseSigning) signingConfig signingConfigs.release
            // R8 shrinks smbj's Bouncy Castle dependency (several MB); keep rules in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            // Duplicate / irrelevant metadata from smbj, Bouncy Castle, mbassador and slf4j.
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/*.md',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/versions/*/module-info.class',
                'module-info.class',
            ]
        }
    }
    testOptions {
        unitTests {
            // android.* stubs return defaults instead of throwing in JVM unit tests (pure logic only).
            returnDefaultValues = true
            all {
                // The opt-in GUID smoke test (SmbSmokeTest) reads its targets from this variable.
                environment 'HOARD_SMOKE_HOSTS', System.getenv('HOARD_SMOKE_HOSTS') ?: ''
                environment 'HOARD_SMOKE_SMB', System.getenv('HOARD_SMOKE_SMB') ?: ''
                // Opt-in read-only multi-share test (SmbMultiShareTest).
                ['HOARD_SMOKE_SHARES', 'HOARD_SMOKE_USER', 'HOARD_SMOKE_PASSWORD'].each { environment it, System.getenv(it) ?: '' }
                testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
            }
        }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Native HoardSmb plugin (dev.hfps.hoard.smb): SMB2/3, coroutines, background transfers.
    implementation "com.hierynomus:smbj:$smbjVersion"
    implementation "org.slf4j:slf4j-nop:$slf4jVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "androidx.work:work-runtime-ktx:$workVersion"
    implementation "androidx.exifinterface:exifinterface:$exifInterfaceVersion"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
    // Real org.json for JVM tests (android.jar only has stubs).
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
apply from: 'image-native.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
